<style>.ser{font-family:Georgia,'Times New Roman',serif;fill:#f7f4ea}.mono{font-family:ui-monospace,Menlo,monospace;fill:#c8a951;letter-spacing:3px}.mut{fill:#9d927e;font-family:ui-monospace,Menlo,monospace}.gold{stroke:#d4af37;fill:none}.cream{stroke:#f7f4ea;fill:none}.thin{stroke-width:1}.med{stroke-width:2}.node{fill:#d4af37;stroke:#f7f4ea;stroke-width:1}</style>
<text x="70" y="78" class="mono" font-size="18">SYSTEM FRICTION INSTITUTE</text>
<text x="70" y="140" class="ser" font-size="68" font-weight="700">SIX INTEGRITIES OF INSTITUTIONAL EVIDENCE</text>
<text x="70" y="188" class="ser" font-size="27">A reconstructable chain from reality to accountability</text>
<line x1="70" y1="218" x2="1530" y2="218" class="gold thin"/>

<g transform="translate(65 320)">
<path d="M60 245 H1410" class="gold med"/>
<g transform="translate(80 0)"><text x="0" y="35" class="mono" font-size="15">01</text><text x="0" y="78" class="ser" font-size="25">CAPTURE</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">what the sensor observed</text></g><g transform="translate(330 0)"><text x="0" y="35" class="mono" font-size="15">02</text><text x="0" y="78" class="ser" font-size="25">TRANSFORMATION</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">what happened to the data</text></g><g transform="translate(580 0)"><text x="0" y="35" class="mono" font-size="15">03</text><text x="0" y="78" class="ser" font-size="25">CONTEXT</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">what corroborates or constrains it</text></g><g transform="translate(830 0)"><text x="0" y="35" class="mono" font-size="15">04</text><text x="0" y="78" class="ser" font-size="25">INFERENCE</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">what was concluded and why</text></g><g transform="translate(1080 0)"><text x="0" y="35" class="mono" font-size="15">05</text><text x="0" y="78" class="ser" font-size="25">AUTHORITY</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">who could authorize the claim</text></g><g transform="translate(1330 0)"><text x="0" y="35" class="mono" font-size="15">06</text><text x="0" y="78" class="ser" font-size="25">RETURN</text><polygon points="0,135 70,95 140,135 140,245 70,285 0,245" class="gold thin"/><circle cx="70" cy="190" r="10" class="node"/><text x="70" y="340" class="mut" font-size="13" text-anchor="middle">what later confirmed or revised it</text></g>
<text x="720" y="470" class="ser" font-size="32" text-anchor="middle">Authenticity alone is insufficient; institutions need reconstructable chains.</text>
