<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">SIX INTEGRITIES OF INSTITUTIONAL EVIDENCE</title><desc id="d">A reconstructable chain from reality to accountability</desc>
