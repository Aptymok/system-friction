<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-labelledby="title desc">
<title id="title">The Years That Did Exist</title>
<desc id="desc">System Friction Institute research lab note cover.</desc>
<rect width="1240" height="1754" fill="#0B0B0A"/>
<g fill="none" stroke="#D4AF37" stroke-width="2">
  <path d="M38 32h70M38 32v70M1202 32h-70M1202 32v70M38 1722h70M38 1722v-70M1202 1722h-70M1202 1722v-70"/>
  <path d="M72 88h1096M72 138h820M72 1028h1096M72 1478h1096"/>
  <path d="M620 32v106M960 70v168"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif">
  <text x="72" y="72" fill="#D4AF37" font-family="monospace" font-size="18" letter-spacing="4">SFI · SYSTEM FRICTION INSTITUTE</text>
  <text x="1040" y="72" fill="#F7F4EA" font-family="monospace" font-size="16" letter-spacing="3">LN. 001 / 2026</text>
  <text x="72" y="190" fill="#D4AF37" font-family="monospace" font-size="18" letter-spacing="4">LAB NOTE / PUBLIC-SOURCE SYNTHESIS</text>
  <text x="72" y="330" fill="#F7F4EA" font-size="86" font-weight="700">THE YEARS</text>
  <text x="72" y="430" fill="#D4AF37" font-size="90" font-weight="700">THAT DID EXIST</text>
  <text x="72" y="500" fill="#F7F4EA" font-size="36">From phantom time to a comparative anatomy</text>
  <text x="72" y="545" fill="#F7F4EA" font-size="36">of civilizational capacity.</text>
  <text x="72" y="650" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">OBJECT</text>
  <text x="300" y="650" fill="#F7F4EA" font-family="monospace" font-size="17">RESEARCH LAB NOTE / PUBLIC-SOURCE SYNTHESIS</text>
  <text x="72" y="700" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">STATE</text>
  <text x="300" y="700" fill="#F7F4EA" font-family="monospace" font-size="17">OPEN INVESTIGATION</text>
  <text x="72" y="750" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">AUTHORITY</text>
  <text x="300" y="750" fill="#F7F4EA" font-family="monospace" font-size="17">SYSTEM FRICTION INSTITUTE</text>
  <text x="72" y="800" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">SOURCE CUT-OFF</text>
  <text x="300" y="800" fill="#F7F4EA" font-family="monospace" font-size="17">20 SEP 2026</text>
  <text x="72" y="850" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">STATUS</text>
  <text x="300" y="850" fill="#F7F4EA" font-family="monospace" font-size="17">OBSERVED / DERIVED / HYPOTHESIZED / NOT VALIDATED</text>
  <text x="72" y="900" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">DOCUMENT</text>
  <text x="300" y="900" fill="#F7F4EA" font-family="monospace" font-size="17">SFI-LN-PS-2026-09-001-PUB-V1.0</text>
  <text x="72" y="1110" fill="#F7F4EA" font-size="54" font-weight="700">TIME CONTINUES.</text>
  <text x="72" y="1175" fill="#D4AF37" font-size="54" font-weight="700">CAPACITY CHANGES.</text>
  <text x="72" y="1250" fill="#F7F4EA" font-size="28">The chronology survives the test. The harder question becomes</text>
  <text x="72" y="1290" fill="#F7F4EA" font-size="28">what a complex system can still reproduce at scale.</text>
  <text x="72" y="1540" fill="#D4AF37" font-family="monospace" font-size="17" letter-spacing="3">SFI RESEARCH · LAB NOTE · 20 SEP 2026</text>
  <text x="940" y="1540" fill="#F7F4EA" font-family="monospace" font-size="17" letter-spacing="2">A4 · 210 × 297 MM</text>
</g>
</svg>