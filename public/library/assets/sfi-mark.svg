<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6DE8B"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#F4D97A"/>
      <stop offset="100%" stop-color="#A67C19"/>
    </linearGradient>
    <radialGradient id="goldNode" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF2B8"/>
      <stop offset="40%" stop-color="#F6D86C"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7317"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(600 600)" filter="url(#softGlow)">
    <!-- outer envelope -->
    <polygon points="0,-420 364,-210 364,210 0,420 -364,210 -364,-210" stroke="url(#goldStroke)" stroke-width="10" stroke-linejoin="round"/>

    <!-- cube envelope lines -->
    <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" stroke="url(#goldStroke)" stroke-width="8" stroke-linejoin="round"/>
    <line x1="0" y1="-420" x2="0" y2="420" stroke="url(#goldStroke)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-364" y1="-210" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="364" y1="-210" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-364" y1="210" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="364" y1="210" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-420" x2="364" y2="-210" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-420" x2="-364" y2="-210" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="420" x2="364" y2="210" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="420" x2="-364" y2="210" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>

    <!-- internal structural hexagon -->
    <polygon points="0,-240 208,-120 208,120 0,240 -208,120 -208,-120" stroke="url(#goldStroke)" stroke-width="9" stroke-linejoin="round"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="url(#goldStroke)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-208" y1="-120" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="208" y1="-120" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-208" y1="120" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>
    <line x1="208" y1="120" x2="0" y2="0" stroke="url(#goldStroke)" stroke-width="5" stroke-linecap="round"/>

    <!-- nodes: six structural + one orbital -->
    <g fill="url(#goldNode)" stroke="#F9E39A" stroke-width="3">
      <circle cx="0" cy="-240" r="22"/>
      <circle cx="-208" cy="-120" r="20"/>
      <circle cx="208" cy="-120" r="20"/>
      <circle cx="-208" cy="120" r="20"/>
      <circle cx="208" cy="120" r="20"/>
      <circle cx="0" cy="240" r="22"/>
      <circle cx="275" cy="0" r="18"/>
    </g>
  </g>
</svg>
