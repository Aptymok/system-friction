name: Temporary evidence/UI cleanup

on:
  push:
    branches:
      - fix/evidence-policy-and-owned-ui-copy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-policy-and-owned-ui-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply cleanup
        run: node scripts/tmp-finalize-evidence-ui-fix.mjs
      - name: Remove temporary cleanup artifacts
        run: |
          rm scripts/tmp-finalize-evidence-ui-fix.mjs
          rm .github/workflows/tmp-finalize-evidence-ui-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "sfi-governed-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sfi): finish evidence policy and bilingual field wiring"
          git push origin HEAD:fix/evidence-policy-and-owned-ui-copy
