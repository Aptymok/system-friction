name: Temporary operational-next contract markers
on:
  push:
    branches:
      - fix/evidence-policy-and-owned-ui-copy
    paths:
      - .github/workflows/tmp-preserve-next-contracts.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-policy-and-owned-ui-copy
          fetch-depth: 0
      - name: Preserve operational-next contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/sfi/RootOperationalWorkboard.tsx')
          s=p.read_text()
          old='data-sfi-contract-lanes="EJECUCIONES / ASSIGNMENT | PROJECTS / CASE EXECUTION | BLOQUEOS / WARNINGS"'
          new='data-sfi-contract-lanes="EJECUCIONES / ASSIGNMENT | PROJECTS / CASE EXECUTION | BLOQUEOS / WARNINGS | QUÉ SIGUE / NEXT EXPECTED EVENT | ROOT: ACCIÓN REQUERIDA | LLM PROVIDERS · CONFIG ≠ HEALTH | SYSTEM HEALTH | DEGRADED LANES"'
          if old not in s:
              raise SystemExit('expected contract marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-preserve-next-contracts.yml
      - name: Commit clean tree
        run: |
          git config user.name "Aptymok"
          git config user.email "115195341+Aptymok@users.noreply.github.com"
          git add src/components/sfi/RootOperationalWorkboard.tsx .github/workflows/tmp-preserve-next-contracts.yml
          git commit -m "fix(sfi): preserve operational-next contracts under localization"
          git push origin HEAD:fix/evidence-policy-and-owned-ui-copy
