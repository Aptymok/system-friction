name: MIHM EXP-001 SFI Data Feasibility

on:
  pull_request:
    paths:
      - 'scripts/research/mihm-exp001-sfi-feasibility.mjs'
      - '.github/workflows/mihm-exp001-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit actual historical GitHub event chronology
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIHM_SAMPLE_LIMIT: '30'
          MIHM_CUTOFF: '2026-10-11T23:59:59Z'
        run: |
          set -euo pipefail
          mkdir -p artifacts/mihm-exp001
          node scripts/research/mihm-exp001-sfi-feasibility.mjs > artifacts/mihm-exp001/chronology.json
          node -e "const a=require('./artifacts/mihm-exp001/chronology.json'); console.log(JSON.stringify({contract:a.contract,counts:a.counts,caveat:a.caveat},null,2))"
      - name: Upload research feasibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihm-exp001-sfi-chronology
          path: artifacts/mihm-exp001/chronology.json
          retention-days: 30
