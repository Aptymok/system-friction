name: SFI Cognitive Olympics · 100+ Real Public Cases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sfi-real-public-100.yml'
      - 'scripts/cognitive-olympics/qa-real-public-100.mjs'
      - 'scripts/cognitive-olympics/lib/dataset.mjs'
      - 'scripts/cognitive-olympics/sfi-agent-bridge.ts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sfi-real-public-100
  cancel-in-progress: true

jobs:
  public-historical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SFI_CL_DATA_DIR: .sfi-cl/data/world-bank
      SFI_CL_RUN_DIR: .sfi-cl/runs/public-real-100
      SFI_CL_CUTOFF_YEAR: '2018'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing application dependencies
        run: npm ci
      # Read immutable bytes actually returned by the official World Bank API.
      # The upstream acquisition was PARTIAL (9/10 indicators unavailable); do
      # NOT claim those missing domains or retry indefinitely.
      - name: Reuse observed official-source artifact from failed multi-domain acquisition
        uses: actions/download-artifact@v4
        with:
          name: sfi-real-public-100-43728323703
          run-id: 43728323703
          repository: Aptymok/system-friction
          github-token: ${{ github.token }}
          path: .sfi-cl
      - name: Check actual source manifest before evaluating any country
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync(process.env.SFI_CL_DATA_DIR+'/manifest.json','utf8'));if(d.records<100||d.countries<100||d.strictReplayEligible!==false)process.exit(1);console.log(JSON.stringify({records:d.records,countries:d.countries,requested:d.indicatorsRequested,failed:d.failures,source:'WORLD_BANK_API_PARTIAL_ACTUAL'}));"
      - name: Execute existing SFI Cognitive Olympics on 220 public historical GDP cases
        run: node scripts/cognitive-olympics/runner.mjs --profile quick --start 2018 --end 2019 --problems 220 --engines stats --run-id public-real-100
      - name: Independently verify source lineage, score, and real registered-agent execution
        run: node scripts/cognitive-olympics/qa-real-public-100.mjs
      - name: Upload inspectable source, decisions, score and independent RETURN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfi-real-public-100-${{ github.run_id }}
          path: |
            .sfi-cl/data/world-bank/manifest.json
            .sfi-cl/data/world-bank/world-bank.jsonl
            .sfi-cl/runs/public-real-100/**
          if-no-files-found: warn
          retention-days: 90
