name: Temporary ROOT lane contract markers

on:
  push:
    branches:
      - fix/evidence-policy-and-owned-ui-copy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-policy-and-owned-ui-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve ROOT lane contracts
        run: node scripts/tmp-preserve-root-lane-contracts.mjs
      - name: Remove temporary artifacts
        run: |
          rm scripts/tmp-preserve-root-lane-contracts.mjs
          rm .github/workflows/tmp-preserve-root-lane-contracts.yml
      - name: Commit clean tree
        run: |
          git config user.name "sfi-governed-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sfi): preserve ROOT lane contracts through localization"
          git push origin HEAD:fix/evidence-policy-and-owned-ui-copy
