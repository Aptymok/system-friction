name: Reality Chain Isolated PostgreSQL Concurrency

on:
  push:
    branches:
      - work/reality-chain-integration-20261024
    paths:
      - '.github/workflows/reality-chain-postgres-concurrency.yml'
      - 'scripts/reality_chain/**'
      - 'scripts/qa-sfi-branch-ci-continuity.mjs'
      - 'src/lib/mihm/**'
      - 'src/app/timeline/**'
      - 'src/components/sfi/OperationalTimeline.tsx'
      - 'src/lib/sfi/case-platform/**'
      - 'src/lib/persistence/**'
      - 'supabase/migrations/*reality_chain*'
  pull_request:
    paths:
      - '.github/workflows/reality-chain-postgres-concurrency.yml'
      - 'scripts/reality_chain/**'
      - 'supabase/migrations/20261023123624_reality_chain_closure_integrity.sql'
      - 'supabase/migrations/20260909080500_sfi_case_object_atomic_writer_v1.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-concurrency:
    name: Verify two-session atomic closure and write exclusion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: sfi_rc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sfi_rc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      SFI_RC_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:5432/sfi_rc_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run two independent transaction sessions on disposable PostgreSQL
        run: node scripts/reality_chain/qa-real-postgres-concurrency.mjs
      - name: Replay a source transaction through the real mirror receiver between isolated databases
        run: node scripts/reality_chain/qa-two-database-mirror-replay.mjs
