name: SFI Vercel Prebuilt Production

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sfi-vercel-prebuilt-production.yml
      - package.json
      - package-lock.json
      - next.config.*
      - tsconfig.json
      - vercel.json
      - 'public/**'
      - 'src/**'
      - 'scripts/merge-openapi-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfi-vercel-prebuilt-production
  cancel-in-progress: false

jobs:
  deploy-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Check Vercel deployment credentials
        id: creds
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'Missing GitHub Secrets: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credentials are configured."
          fi

      - name: Stop when credentials are unavailable
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo 'SFI_VERCEL_PREBUILT_BLOCKED_MISSING_GITHUB_SECRETS'
          exit 1

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Verify Vercel project scope
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          team_http=$(curl -sS -o /tmp/vercel-team.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID")
          project_http=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "VERCEL_TEAM_ACCESS_HTTP=$team_http"
          echo "VERCEL_PROJECT_ACCESS_HTTP=$project_http"
          if [ "$project_http" != "200" ]; then
            echo 'SFI_VERCEL_PROJECT_SCOPE_INVALID_OR_UNAUTHORIZED'
            exit 1
          fi
          if [ "$team_http" = "403" ]; then
            echo 'SFI_VERCEL_SCOPED_TOKEN_TEAM_READ_RESTRICTED_PROJECT_ACCESS_CONFIRMED'
          elif [ "$team_http" != "200" ]; then
            echo 'SFI_VERCEL_TEAM_LOOKUP_NONBLOCKING_PROJECT_SCOPE_CONFIRMED'
          fi

      - name: Materialize explicit Vercel project link
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))"
          echo 'SFI_VERCEL_PROJECT_LINK_MATERIALIZED'

      - name: Pull production project settings
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify public Supabase build configuration
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nwrmbkgsnrhdscnsyoko.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5bmBY6_sN3_X125_DhvW5w_IFvcI3l1
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || '';
          const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY || '';
          if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(url)) throw new Error('SFI_PUBLIC_SUPABASE_URL_INVALID');
          if (!key.startsWith('sb_publishable_')) throw new Error('SFI_PUBLIC_SUPABASE_KEY_INVALID');
          if (url.includes('[SENSITIVE]') || key.includes('[SENSITIVE]')) throw new Error('SFI_PUBLIC_SUPABASE_CONFIG_REDACTED');
          console.log('SFI_PUBLIC_SUPABASE_BUILD_CONFIG_OK');
          NODE

      - name: Build production artifact in GitHub Actions
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://nwrmbkgsnrhdscnsyoko.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5bmBY6_sN3_X125_DhvW5w_IFvcI3l1
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
