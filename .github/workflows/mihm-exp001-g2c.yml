name: MIHM EXP-001 G2c Independent PR Cohort
on:
  pull_request:
    paths:
      - 'scripts/research/mihm-exp001-g2c-cohort.mjs'
      - 'scripts/research/mihm-exp001-g2c-cohort.test.mjs'
      - '.github/workflows/mihm-exp001-g2c.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  g2c_cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no chronology, cohort or outcome leakage
        run: node --test scripts/research/mihm-exp001-g2c-cohort.test.mjs
      - name: Collect real outcome-independent GitHub PR cohort
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIHM_G2C_START: '2026-09-15T00:00:00Z'
          MIHM_G2C_CUTOFF: '2026-10-11T23:59:59Z'
          MIHM_G2C_PR_LIMIT: '24'
          MIHM_G2C_PAGE_LIMIT: '8'
          MIHM_G2C_COMMITS_PER_PR: '3'
        run: |
          set -euo pipefail
          mkdir -p artifacts/mihm-exp001
          node scripts/research/mihm-exp001-g2c-cohort.mjs > artifacts/mihm-exp001/g2c-cohort.json
          node -e "const a=require('./artifacts/mihm-exp001/g2c-cohort.json');console.log(JSON.stringify({contract:a.contract,counts:a.counts,risk:a.risk,errors:a.errors.length,warnings:a.warnings.length,apiRequestCount:a.apiRequestCount},null,2))"
      - name: Save temporary research-only source audit
        uses: actions/upload-artifact@v4
        with:
          name: mihm-exp001-g2c-cohort
          path: artifacts/mihm-exp001/g2c-cohort.json
          retention-days: 30
          if-no-files-found: error
