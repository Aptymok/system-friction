name: One-time SFI verified branch cleanup
on:
  push:
    branches:
      - work/reality-chain-integration-20261024
    paths:
      - .github/workflows/sfi-one-time-prune-integrated-branches.yml
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'Aptymok/system-friction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune exact immutable refs with full ancestry checks
        shell: bash
        run: |
          set -euo pipefail
          echo '# SFI exact-ref ancestry-verified cleanup' >> "$GITHUB_STEP_SUMMARY"
          echo '| Branch | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            if [[ "$branch" == main || "$branch" == work/reality-chain-integration-20261024 ]]; then
              echo "| \`$branch\` | PROTECTED - SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            if [[ "$actual" != "$expected" ]]; then
              echo "| \`$branch\` | HEAD_CHANGED_OR_MISSING - SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            remaining=$(gh api "repos/$GITHUB_REPOSITORY/compare/$expected...$GITHUB_SHA" --jq '.behind_by' 2>/dev/null || echo unknown)
            if [[ "$remaining" != 0 ]]; then
              echo "| \`$branch\` | UNMERGED_COMMITS - SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1; then
              echo "| \`$branch\` | DELETED after ancestry proof |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$branch\` | DELETE_REF_FAILED |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<'BRANCHES'
          feat/adaptive-attractor-reconfiguration-20261022|7599044dd79362f6fae45f69041df43b85685695
          feat/attractor-72h-contest-case-intake-20261021|067e0dc2aee4c08d2fd46fc375941ac314caab5a
          feat/institutional-evolution-cognitive-inactivity-20261021|924a5de17f1f182bc438b6a45cb6462aa94bc414
          feat/method-lab-independent-review-dossier-p3|97b89b07cd8ed3084cfb353ac09f16e3adc4ab73
          feat/method-lab-possibility-field-20261021|0e80c7fdede810c31066772b859199937a92ee50
          feat/research-assurance-p1-p5|41ed88e344e153c9dddb245dd3aad22306a09a7e
          feature/discovery-model-independent-opportunity-cycle-20261020|5b3fb6a98bff9fc244201f0bc05e2ea16e691553
          fix/adaptive-case-evidence-provenance-20261022|9be5dcf27d5ee54fc4743fd1a99cd956e0db5d76
          fix/adaptive-material-action-boundary-20261022|0004a9ef3e48e7855dffc7a7aec7b5e9c8f7fc57
          fix/ci-discovery-p8-locked-operational-20261021|f1871a5a15d15915cf107e633d82b290753fa00c
          fix/continuity-outbox-drain-20261022|ebc34b84bc60c2e3b9315d6be1c7527454e81103
          fix/empirical-contrast-idempotence-20261022|892b704bbbf65595c91d14756d38592f81431cc5
          fix/explicit-llm-off-cognitive-20261021|b849f7ac895cb05d84f0face46ad1e2f0694c2ab
          fix/mem003-tenant-members-semantic-recovery|a441b9d1f0bc16556d1b8d968a087896fdc754db
          fix/world-partial-resume-cooldown-20261022|0b429c49d4551edfbdee4d7c41670cd91d71d207
          fix/world-repeat-retry-evidence-gate-20261022|c7a7741abb7e4414d8d7dd66a5a0e03c0f51d03c
          fix/804-recovery-journal-drain|002c63c0ee3990279d01e5f0ce77e25ab1134843
          BRANCHES
