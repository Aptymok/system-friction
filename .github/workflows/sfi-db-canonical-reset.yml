name: SFI DB Canonical Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET_SFI_CANONICAL to execute issue #430 reset.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/sfi-db-canonical-reset-trigger'

permissions:
  contents: read

concurrency:
  group: sfi-db-canonical-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.SFI_DATABASE_URL || secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL }}
      SFI_SUPABASE_REGION: us-west-1
      SFI_DB_EVIDENCE_DIR: /tmp/sfi-db-evidence
      SFI_DB_REQUIRE_RESET_CLASSIFICATION: 'YES'
      SFI_DB_SNAPSHOT_MAX_AGE_MINUTES: '180'
      SFI_INSTITUTIONAL_INTEGRATION_STATE: /tmp/sfi-institutional-integrations.json
      SFI_PRODUCTION_INSTRUMENT_STATE: /tmp/sfi-production-instruments.json
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate destructive trigger and database secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo 'No PostgreSQL secret is configured for canonical reset.' >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.confirm }}" == 'RESET_SFI_CANONICAL' ]]
          else
            test -f .github/sfi-db-canonical-reset-trigger
            grep -Fx 'SFI_DB_CANONICAL_RESET=ISSUE_430' .github/sfi-db-canonical-reset-trigger
          fi

      - name: Install PostgreSQL 17 reset dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg zip unzip
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '17\.'
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -E '17\.'
          npm ci

      - name: Resolve IPv4 session pooler and verify PostgreSQL connectivity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db/resolve-reset-database-url.mjs

      - name: Fail closed unless continuity reseed trigger is live
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db/verify-continuity-reseed-ready.mjs pre

      - name: Export and validate canonical genesis configuration
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/db/preserve-institutional-integrations.ts export
          node --import tsx scripts/db/preserve-institutional-integrations.ts verify
          node --import tsx scripts/db/preserve-production-instrument-bank.ts export
          node --import tsx scripts/db/preserve-production-instrument-bank.ts verify
          test -s "$SFI_INSTITUTIONAL_INTEGRATION_STATE"
          test -s "$SFI_PRODUCTION_INSTRUMENT_STATE"
          chmod 600 "$SFI_INSTITUTIONAL_INTEGRATION_STATE" "$SFI_PRODUCTION_INSTRUMENT_STATE"

      - name: Create fresh full evidentiary snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db/create-db-evidence-snapshot.mjs

      - name: Resolve and verify V2 snapshot receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$(cat "${SFI_DB_EVIDENCE_DIR}/LATEST_DB_EVIDENCE_RECEIPT.txt")"
          test -f "${RECEIPT}"
          SFI_DB_SNAPSHOT_RECEIPT="${RECEIPT}" node scripts/db/verify-db-evidence-snapshot.mjs
          echo "path=${RECEIPT}" >> "$GITHUB_OUTPUT"

      - name: Upload proof before any destructive statement
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: sfi-db-pre-reset-proof-${{ github.run_id }}
          path: /tmp/sfi-db-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Execute founder-authorized canonical reset and restore registered institutional integrations
        shell: bash
        env:
          SFI_DB_SNAPSHOT_RECEIPT: ${{ steps.receipt.outputs.path }}
          SFI_DB_RESET_CONFIRM: RESET_SFI_CANONICAL
          SFI_DB_RESET_MODE: EVIDENCE_FIRST_CANONICAL_RESET
          SFI_DB_EXTERNAL_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          SFI_DB_EXTERNAL_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
          SFI_DB_EXTERNAL_ARTIFACT_URL: ${{ steps.proof.outputs.artifact-url }}
        run: |
          set -euo pipefail
          node scripts/db/reset-sfi-operational-tables.mjs
          node scripts/db/verify-continuity-reseed-ready.mjs post | tee /tmp/sfi-continuity-reseed.json
          node --import tsx scripts/db/preserve-institutional-integrations.ts restore | tee /tmp/sfi-institutional-restore.json
          node --import tsx scripts/db/preserve-production-instrument-bank.ts restore | tee /tmp/sfi-instrument-restore.json
          node --import tsx scripts/db/preserve-institutional-integrations.ts verify
          node --import tsx scripts/db/preserve-production-instrument-bank.ts verify
          rm -f "$SFI_INSTITUTIONAL_INTEGRATION_STATE" "$SFI_PRODUCTION_INSTRUMENT_STATE"

      - name: Upload post-reset genesis receipts
        id: genesis
        uses: actions/upload-artifact@v4
        with:
          name: sfi-db-post-reset-genesis-${{ github.run_id }}
          path: |
            docs/db/SFI_CANONICAL_RESET_REPORT_*.json
            /tmp/sfi-continuity-reseed.json
            /tmp/sfi-institutional-restore.json
            /tmp/sfi-instrument-restore.json
          if-no-files-found: error
          retention-days: 90

      - name: Record canonical reset handoff
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## SFI canonical persistence reset'
            echo
            echo "- Git commit: \`${GITHUB_SHA}\`"
            echo "- Pre-reset proof artifact: \`${{ steps.proof.outputs.artifact-id }}\`"
            echo "- Pre-reset proof digest: \`${{ steps.proof.outputs.artifact-digest }}\`"
            echo "- Post-reset genesis artifact: \`${{ steps.genesis.outputs.artifact-id }}\`"
            echo '- Database route: **Supavisor session mode / IPv4 / SSL required**'
            echo '- Legacy preservation: **full longitudinal World corpus**'
            echo '- Protected World plane: source observations, friction readings, hypotheses, outcomes, learning events, WorldSpect snapshots, World Vector cycles/observations/reports/alerts'
            echo '- Continuity singleton: **RESEED_MINIMAL; live AFTER TRUNCATE trigger required before destructive reset and post-reset singleton verified**'
            echo '- Registered institutional identities/OAuth configuration: **reseeded from canonical registry; no authority expansion; no usage history restored**'
            echo '- Production Instrument Bank configuration: **PRODUCTION + ELIGIBLE SFZ packages and rights evidence reseeded; render history not restored**'
            echo '- Twin/AMV/QA/governance/runtime learning outside the World corpus: **not imported**'
          } >> "$GITHUB_STEP_SUMMARY"
