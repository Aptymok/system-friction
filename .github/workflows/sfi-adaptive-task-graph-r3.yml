name: SFI Adaptive Task Graph R3

on:
  pull_request:
    paths:
      - 'src/lib/sfi/cognitive-runtime/**'
      - '.github/workflows/sfi-adaptive-task-graph-r3.yml'

permissions:
  contents: read

jobs:
  adaptive-task-graph:
    name: SFI-RUNTIME-ADAPTIVE-CAPABILITY-1.0 + SFI-CAPABILITY-AUTHORITY-1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: SFI-CAPABILITY-AUTHORITY-1.0
        run: node --import tsx --test src/lib/sfi/cognitive-runtime/capabilityBroker.test.ts
      - name: SFI-RUNTIME-ADAPTIVE-CAPABILITY-1.0
        run: node --import tsx --test src/lib/sfi/cognitive-runtime/adaptiveTaskGraphRuntime.test.ts src/lib/sfi/cognitive-runtime/adaptiveTaskGraphAssurance.test.ts
