name: SFI External OAuth

on:
  pull_request:
    paths:
      - 'src/app/api/oauth/**'
      - 'src/app/api/external/v1/**'
      - 'src/app/api/external/openapi/**'
      - 'src/app/api/acp/proposals/route.ts'
      - 'src/app/integrations/**'
      - 'src/components/sfi/OAuthIntegrationsSurface.*'
      - 'src/components/sfi/SessionControls.tsx'
      - 'src/components/sfi/SfiConsole.tsx'
      - 'src/lib/sfi/externalAuth.ts'
      - 'src/lib/sfi/externalSessionToken.ts'
      - 'src/lib/sfi/oauthConfig.ts'
      - 'src/lib/sfi/oauthClientRegistry.ts'
      - 'src/lib/sfi/cognitive-runtime/**'
      - 'src/lib/sfi/personal/**'
      - 'src/lib/system/access/**'
      - 'src/components/sfi/LoginSurface.tsx'
      - 'src/components/sfi/PersonalCognitiveLabWorkspace.tsx'
      - 'src/app/method-lab/page.tsx'
      - 'supabase/migrations/*oauth*'
      - 'supabase/migrations/*personal_cognitive*'
      - 'public/openapi.json'
      - 'scripts/qa-sfi-external-oauth.ts'
      - 'scripts/qa-sfi-host-bound-openapi.ts'
      - 'scripts/qa-sfi-oauth-integrations.ts'
      - 'scripts/qa-sfi-cognitive-automation-workspaces.ts'
      - '.github/workflows/sfi-external-oauth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify user-bound external OAuth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify OAuth governance contract
        run: npx tsx scripts/qa-sfi-external-oauth.ts

      - name: Verify host-bound external OpenAPI
        run: npx tsx scripts/qa-sfi-host-bound-openapi.ts

      - name: Verify OAuth integrations self-service
        run: npx tsx scripts/qa-sfi-oauth-integrations.ts

      - name: Verify cognitive automation and personal workspace closure
        run: npx tsx scripts/qa-sfi-cognitive-automation-workspaces.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
