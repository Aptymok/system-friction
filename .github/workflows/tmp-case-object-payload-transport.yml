name: Temporary Case Object Payload Transport Patch

on:
  push:
    branches:
      - fix/case-object-payload-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/case-object-payload-transport
          fetch-depth: 0

      - name: Apply bounded transport patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          route = 'src/app/api/external/v1/cases/object/route.ts'
          replace_once(
              route,
              "import { NextResponse } from 'next/server';\n",
              "import { isDeepStrictEqual } from 'node:util';\nimport { NextResponse } from 'next/server';\n",
          )
          replace_once(
              route,
              "function nullableText(value: unknown): string | null {\n  const valueText = text(value);\n  return valueText || null;\n}\n",
              "function nullableText(value: unknown): string | null {\n  const valueText = text(value);\n  return valueText || null;\n}\n\nfunction payloadFromTransport(body: Row): Row {\n  const directPayload = isRow(body.payload) ? row(body.payload) : null;\n  const hasPayloadJson = body.payloadJson !== undefined && body.payloadJson !== null;\n  let jsonPayload: Row | null = null;\n\n  if (hasPayloadJson) {\n    const rawPayloadJson = text(body.payloadJson);\n    if (!rawPayloadJson) throw new Error('SFI_CASE_PAYLOAD_JSON_REQUIRED');\n    let parsed: unknown;\n    try {\n      parsed = JSON.parse(rawPayloadJson);\n    } catch {\n      throw new Error('SFI_CASE_PAYLOAD_JSON_INVALID');\n    }\n    if (!isRow(parsed)) throw new Error('SFI_CASE_PAYLOAD_JSON_OBJECT_REQUIRED');\n    jsonPayload = parsed;\n  }\n\n  if (directPayload && jsonPayload && !isDeepStrictEqual(directPayload, jsonPayload)) {\n    throw new Error('SFI_CASE_PAYLOAD_TRANSPORT_CONFLICT');\n  }\n\n  const payload = jsonPayload ?? directPayload;\n  if (!payload) throw new Error('SFI_CASE_PAYLOAD_REQUIRED');\n  return payload;\n}\n",
          )
          replace_once(
              route,
              "    if (!isRow(body.payload)) throw new Error('SFI_CASE_PAYLOAD_REQUIRED');\n    const payload = row(body.payload);\n",
              "    const payload = payloadFromTransport(body);\n",
          )
          replace_once(
              route,
              "        canonicalRefTransport: 'FLAT_REQUIRED',\n        canonicalRefId,\n",
              "        canonicalRefTransport: 'FLAT_REQUIRED',\n        payloadTransport: body.payloadJson !== undefined ? 'JSON_STRING' : 'LEGACY_OBJECT',\n        canonicalRefId,\n",
          )

          merge = 'scripts/merge-openapi-cases.mjs'
          replace_once(
              merge,
              "api.info['x-sfi-action-revision'] = 'case-lifecycle-actions-v3';",
              "api.info['x-sfi-action-revision'] = 'case-lifecycle-actions-v4';",
          )
          replace_once(
              merge,
              "required: ['caseId', 'kind', 'canonicalRefId', 'payload'],",
              "required: ['caseId', 'kind', 'canonicalRefId', 'payloadJson'],",
          )
          replace_once(
              merge,
              "    payload: { type: 'object', additionalProperties: true },\n    observedAt: { type: ['string', 'null'] },\n  },\n};\n\napi.components.schemas.CaseReadRequest",
              "    payloadJson: {\n      type: 'string',\n      minLength: 2,\n      description: 'Required GPT Action transport field. JSON string that must parse to one object; SFI reconstructs the canonical payload before calling the existing Case writer.',\n    },\n    payload: {\n      type: 'object',\n      additionalProperties: true,\n      description: 'Legacy direct-client compatibility only. When payloadJson is also present both representations must be structurally equivalent.',\n    },\n    observedAt: { type: ['string', 'null'] },\n  },\n};\n\napi.components.schemas.CaseReadRequest",
          )
          replace_once(
              merge,
              "description: 'Dedicated GPT Action for Case objects. canonicalRefId is required and reconstructed inside SFI. Cannot create accepted evidence, governance, intervention, RETURN or truth claims.',",
              "description: 'Dedicated GPT Action for Case objects. canonicalRefId and payloadJson are transport-safe required fields reconstructed inside SFI. Cannot create accepted evidence, governance, intervention, RETURN or truth claims.',",
          )

          manifest = 'src/app/api/external/v1/manifest/route.ts'
          replace_once(manifest, "version: '1.17.1',", "version: '1.17.2',")
          replace_once(
              manifest,
              "body: { required: ['caseId', 'kind', 'canonicalRefId', 'payload'] }, description: 'Persist one bounded Case object through transport-safe flat canonicalRef fields using the canonical Case writer.",
              "body: { required: ['caseId', 'kind', 'canonicalRefId', 'payloadJson'] }, description: 'Persist one bounded Case object through transport-safe flat canonicalRef fields plus JSON-string payload transport using the canonical Case writer.",
          )

          qa = 'scripts/qa-sfi-case-gpt-bridge.ts'
          replace_once(
              qa,
              "assert.ok(objectRoute.includes(\"if (!isRow(body.payload)) throw new Error('SFI_CASE_PAYLOAD_REQUIRED')\"), 'case_object_action_must_reject_missing_or_non_object_payload');",
              "assert.ok(objectRoute.includes('payloadFromTransport(body)'), 'case_object_action_must_reconstruct_transport_payload');\nassert.ok(objectRoute.includes(\"SFI_CASE_PAYLOAD_JSON_INVALID\"), 'case_object_action_must_reject_invalid_payload_json');\nassert.ok(objectRoute.includes(\"SFI_CASE_PAYLOAD_JSON_OBJECT_REQUIRED\"), 'case_object_action_must_require_object_payload_json');\nassert.ok(objectRoute.includes(\"SFI_CASE_PAYLOAD_TRANSPORT_CONFLICT\"), 'case_object_action_must_fail_closed_on_payload_conflict');\nassert.ok(objectRoute.includes('isDeepStrictEqual'), 'case_object_action_must_compare_dual_payloads_structurally');",
          )
          replace_once(
              qa,
              "assert.ok(manifest.includes(\"body: { required: ['caseId', 'kind', 'canonicalRefId', 'payload'] }\"), 'manifest_dedicated_case_object_required_fields_missing');",
              "assert.ok(manifest.includes(\"body: { required: ['caseId', 'kind', 'canonicalRefId', 'payloadJson'] }\"), 'manifest_dedicated_case_object_required_fields_missing');",
          )
          replace_once(
              qa,
              "for (const field of ['caseId', 'kind', 'canonicalRefId', 'payload']) {",
              "for (const field of ['caseId', 'kind', 'canonicalRefId', 'payloadJson']) {",
          )
          replace_once(
              qa,
              "assert.equal(objectSchema.properties?.canonicalRefId?.type, 'string', 'case_object_transport_flat_ref_id_missing');",
              "assert.equal(objectSchema.properties?.canonicalRefId?.type, 'string', 'case_object_transport_flat_ref_id_missing');\nassert.equal(objectSchema.properties?.payloadJson?.type, 'string', 'case_object_transport_payload_json_missing');\nassert.equal(objectSchema.properties?.payload?.type, 'object', 'case_object_transport_legacy_payload_compatibility_missing');",
          )
          replace_once(
              qa,
              "  payloadRequiredAtRuntime: true,",
              "  payloadJsonRequiredForGptTransport: true,\n  legacyPayloadObjectAcceptedAtRuntime: true,",
          )

          owner_qa = 'scripts/qa-sfi-model-owner-context.ts'
          replace_once(owner_qa, "externalGatewayVersion: '1.17.1',", "externalGatewayVersion: '1.17.2',")

          trigger = '.github/sfi-production-deploy-trigger'
          replace_once(trigger, 'gateway_version=1.17.1', 'gateway_version=1.17.2')
          replace_once(trigger, 'action_revision=case-lifecycle-actions-v3', 'action_revision=case-lifecycle-actions-v4')
          replace_once(trigger, 'live_openapi_version_1.17.1', 'live_openapi_version_1.17.2')

          # Keep the downstream OpenAPI floor from ever projecting an older gateway version.
          studio = 'scripts/merge-openapi-studio-attachments.mjs'
          replace_once(studio, "versionBelow(api.info.version, '1.17.1')) api.info.version = '1.17.1';", "versionBelow(api.info.version, '1.17.2')) api.info.version = '1.17.2';")

      - name: Regenerate Case OpenAPI projection
        run: node scripts/merge-openapi-cases.mjs

      - name: Static transport assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "payloadFromTransport(body)" src/app/api/external/v1/cases/object/route.ts
          grep -q "SFI_CASE_PAYLOAD_JSON_INVALID" src/app/api/external/v1/cases/object/route.ts
          grep -q "required: \['caseId', 'kind', 'canonicalRefId', 'payloadJson'\]" scripts/merge-openapi-cases.mjs
          grep -q '"payloadJson"' public/openapi.json
          grep -q '"case-lifecycle-actions-v4"' public/openapi.json
          grep -q "version: '1.17.2'" src/app/api/external/v1/manifest/route.ts

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-case-object-payload-transport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/external/v1/cases/object/route.ts \
                  scripts/merge-openapi-cases.mjs \
                  src/app/api/external/v1/manifest/route.ts \
                  scripts/qa-sfi-case-gpt-bridge.ts \
                  scripts/qa-sfi-model-owner-context.ts \
                  scripts/merge-openapi-studio-attachments.mjs \
                  .github/sfi-production-deploy-trigger \
                  public/openapi.json \
                  .github/workflows/tmp-case-object-payload-transport.yml
          git commit -m "fix(cases): make Case object payload transport-safe"
          git push origin HEAD:fix/case-object-payload-transport
