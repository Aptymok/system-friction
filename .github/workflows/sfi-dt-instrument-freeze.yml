name: DT Instrument Freeze

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-dt-freeze:
    name: Verify SFI-DT-1.0 instrument freeze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify DT instrument freeze
        run: |
          npx tsx scripts/qa-sfi-decision-transfer-instrument-freeze.ts
          npx tsx scripts/qa-sfi-dt-experiment-freeze-final.ts
