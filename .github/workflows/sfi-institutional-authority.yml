name: SFI Institutional Authority

on:
  pull_request:
    paths:
      - 'src/lib/system/access/**'
      - 'docs/program/SFI-INSTITUTIONAL-AUTHORITY-PLANE-2026.md'
      - '.github/workflows/sfi-institutional-authority.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/system/access/**'
      - 'docs/program/SFI-INSTITUTIONAL-AUTHORITY-PLANE-2026.md'
      - '.github/workflows/sfi-institutional-authority.yml'

permissions:
  contents: read

jobs:
  authority:
    name: Verify role and appointment separation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after ${attempt} attempts."
              exit 1
            fi
            rm -rf node_modules/ffmpeg-static
            sleep $((attempt * 10))
          done

      - name: SFI-INSTITUTIONAL-AUTHORITY-INTEGRITY-1.0
        run: node --import tsx --test src/lib/system/access/institutionalAuthorityIntegrity.test.ts

      - name: SFI-INSTITUTIONAL-APPOINTMENT-SEPARATION-1.0
        run: node --import tsx --test src/lib/system/access/institutionalAppointmentSeparation.test.ts

      - name: Typecheck authority plane
        run: npm run typecheck
