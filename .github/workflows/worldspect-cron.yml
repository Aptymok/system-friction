name: SFI World + Institutional Observation Cycle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/sfi-world-readjudication-trigger

jobs:
  observe_world:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve UTC Measurement Slot
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 6 ]; then
            MODE="daily_cron"
            SLOT="00"
          elif [ "$HOUR" -lt 12 ]; then
            MODE="manual"
            SLOT="06"
          elif [ "$HOUR" -lt 18 ]; then
            MODE="diagnostic"
            SLOT="12"
          else
            MODE="fallback_runtime"
            SLOT="18"
          fi
          echo "WORLDSPECT_INGEST_MODE=$MODE" >> "$GITHUB_ENV"
          echo "WORLDSPECT_MEASUREMENT_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "World measurement slot=$SLOT mode=$MODE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Canonical WorldSpect Measurement
        id: worldspect
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          WORLDSPECT_INGEST_SECRET: ${{ secrets.WORLDSPECT_INGEST_SECRET }}
        run: |
          test -n "$VERCEL_APP_URL" || (echo "Missing VERCEL_APP_URL secret" && exit 1)
          test -n "$WORLDSPECT_INGEST_SECRET" || (echo "Missing WORLDSPECT_INGEST_SECRET" && exit 1)
          body="$(curl --fail-with-body -X POST "$VERCEL_APP_URL/api/cron/worldspect" \
            -H "Authorization: Bearer $WORLDSPECT_INGEST_SECRET" \
            -H "X-SFI-Ingest-Mode: $WORLDSPECT_INGEST_MODE" \
            -H "X-SFI-Measurement-Slot: $WORLDSPECT_MEASUREMENT_SLOT")"
          printf '%s\n' "$body"
          status="$(BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok !== true) process.exit(2);
          process.stdout.write(body.status === 'EGRESS_RESTRICTED' ? 'EGRESS_RESTRICTED' : 'EXECUTED');
          NODE
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Execute World Observatory Observation Hypothesis Calibration Cycle
        id: observatory
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          WORLDSPECT_INGEST_SECRET: ${{ secrets.WORLDSPECT_INGEST_SECRET }}
        run: |
          body="$(curl --fail-with-body -X POST "$VERCEL_APP_URL/api/cron/world-observatory" \
            -H "Authorization: Bearer $WORLDSPECT_INGEST_SECRET")"
          printf '%s\n' "$body"
          status="$(BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok !== true) process.exit(2);
          process.stdout.write(body.status === 'EGRESS_RESTRICTED' ? 'EGRESS_RESTRICTED' : 'EXECUTED');
          NODE
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Execute SFI Institutional Cognitive Cycle
        id: institutional
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          WORLDSPECT_INGEST_SECRET: ${{ secrets.WORLDSPECT_INGEST_SECRET }}
        run: |
          body="$(curl --fail-with-body -X POST "$VERCEL_APP_URL/api/cron/sfi-institutional-cycle" \
            -H "Authorization: Bearer $WORLDSPECT_INGEST_SECRET")"
          printf '%s\n' "$body"
          status="$(BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok !== true) process.exit(2);
          process.stdout.write(body.status === 'EGRESS_RESTRICTED' ? 'EGRESS_RESTRICTED' : 'EXECUTED');
          NODE
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Classify scheduled observation execution
        env:
          WORLDSPECT_STAGE: ${{ steps.worldspect.outputs.status }}
          OBSERVATORY_STAGE: ${{ steps.observatory.outputs.status }}
          INSTITUTIONAL_STAGE: ${{ steps.institutional.outputs.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const stages = [
            process.env.WORLDSPECT_STAGE,
            process.env.OBSERVATORY_STAGE,
            process.env.INSTITUTIONAL_STAGE,
          ];
          const restricted = stages.filter((value) => value === 'EGRESS_RESTRICTED').length;
          const executed = stages.filter((value) => value === 'EXECUTED').length;
          let state = 'INVALID';
          if (restricted === stages.length) state = 'BLOCKED_BY_EGRESS_POLICY';
          else if (executed === stages.length) state = 'EXECUTED';
          else {
            console.error(`SFI_WORLD_CYCLE_MIXED_EGRESS_STATE stages=${stages.join(',')}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `SFI_WORLD_CYCLE_EXECUTION_STATE=${state}\n`);
          console.log(`SFI_WORLD_CYCLE_EXECUTION_STATE=${state}`);
          NODE

      - name: Run World Vector Pulse QA
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          WORLDSPECT_INGEST_SECRET: ${{ secrets.WORLDSPECT_INGEST_SECRET }}
        run: |
          node scripts/qa-world-vector-pulse.mjs


  readjudicate_world:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute bounded historical World readjudication
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          WORLDSPECT_INGEST_SECRET: ${{ secrets.WORLDSPECT_INGEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_APP_URL" || (echo "Missing VERCEL_APP_URL secret" && exit 1)
          test -n "$WORLDSPECT_INGEST_SECRET" || (echo "Missing WORLDSPECT_INGEST_SECRET" && exit 1)
          payload="$(node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/sfi-world-readjudication-trigger', 'utf8');
          const ids = [...new Set(source.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi) || [])].slice(0, 20);
          if (!ids.length) process.exit(2);
          process.stdout.write(JSON.stringify({ hypothesisIds: ids }));
          NODE
          )"
          body="$(curl --fail-with-body -X POST "$VERCEL_APP_URL/api/cron/world-observatory" \
            -H "Authorization: Bearer $WORLDSPECT_INGEST_SECRET" \
            -H "X-SFI-World-Readjudication: authorized" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          printf '%s\n' "$body"
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.contract !== 'SFI-WORLD-HISTORICAL-READJUDICATION-1.1') process.exit(4);
          if (!body.calibration || typeof body.calibration.calibrated !== 'number') process.exit(5);
          console.log(`SFI_WORLD_READJUDICATION status=${body.status} calibrated=${body.calibration.calibrated} reopened=${body.calibration.reopened} warnings=${JSON.stringify(body.calibration.warnings)} providers=${JSON.stringify(body.providers)}`);
          if (body.ok !== true || body.status !== 'READJUDICATION_EXECUTED') process.exit(2);
          NODE
