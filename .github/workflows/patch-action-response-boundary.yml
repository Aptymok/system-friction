name: Patch SFI Action Response Boundary

on:
  push:
    branches:
      - fix/action-response-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[response-boundary-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/action-response-boundary
          fetch-depth: 0

      - name: Apply bounded external-cycle response projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('src/app/api/external/v1/signal/route.ts')
          route = route_path.read_text()

          anchor = "function text(value: unknown) { return typeof value === 'string' && value.trim() ? value.trim() : null; }\n"
          helper = r'''

type UniversalCycleHistory = Awaited<ReturnType<typeof readUniversalCycleHistory>>;

function compactEventReference(value: unknown) {
  const row = record(value);
  if (!Object.keys(row).length) return null;
  return {
    eventId: typeof row.event_id === 'string' ? row.event_id : null,
    eventName: typeof row.event_name === 'string' ? row.event_name : null,
    epistemicClass: typeof row.epistemic_class === 'string' ? row.epistemic_class : null,
    confidence: typeof row.confidence === 'number' ? row.confidence : null,
    occurredAt: typeof row.occurred_at === 'string' ? row.occurred_at : null,
  };
}

function compactEventReferences(value: unknown) {
  return Array.isArray(value)
    ? value.map(compactEventReference).filter((item): item is NonNullable<ReturnType<typeof compactEventReference>> => Boolean(item))
    : [];
}

function compactCycleHistory(history: UniversalCycleHistory | null) {
  if (!history) return null;
  const events = Array.isArray(history.events) ? history.events : [];
  return {
    ok: history.ok,
    cycleId: history.cycleId,
    state: history.state ?? null,
    error: history.error ?? null,
    eventCount: events.length,
    opened: compactEventReference(history.opened),
    latestEvent: compactEventReference(events.length ? events[events.length - 1] : null),
    resumptions: compactEventReferences(history.resumptions),
    cognitiveRuns: compactEventReferences(history.cognitiveRuns),
    structuredResults: compactEventReferences(history.structuredResults),
    aiSyntheses: compactEventReferences(history.aiSyntheses),
    returns: compactEventReferences(history.returns),
    returnContrasts: compactEventReferences(history.returnContrasts),
    closureEnvelopes: compactEventReferences(history.closureEnvelopes),
    closures: compactEventReferences(history.closures),
    transportBoundary: 'COMPACT_EXTERNAL_CHECKPOINT_NO_EVENT_PAYLOADS',
  };
}
'''
          if 'function compactCycleHistory(' not in route:
              if anchor not in route:
                  raise SystemExit('route helper anchor not found')
              route = route.replace(anchor, anchor + helper, 1)

          replacements = {
              "cycle: history }, { status: history.ok ? 200 : 500 });": "cycle: compactCycleHistory(history) }, { status: history.ok ? 200 : 500 });",
              "history?: Awaited<ReturnType<typeof readUniversalCycleHistory>>;": "checkpoint?: ReturnType<typeof compactCycleHistory>;",
              "history: resumeHistory,": "checkpoint: compactCycleHistory(resumeHistory),",
              "reread: history,": "reread: compactCycleHistory(history),",
              "cycleId, history: historyBefore }, { status: 503 });": "cycleId, history: compactCycleHistory(historyBefore) }, { status: 503 });",
          }
          for old, new in replacements.items():
              if old in route:
                  route = route.replace(old, new)

          forbidden = [
              'history: resumeHistory,',
              'reread: history,',
              'cycle: history }, { status: history.ok ? 200 : 500 });',
          ]
          for token in forbidden:
              if token in route:
                  raise SystemExit(f'unbounded response token remains: {token}')

          if route.count('compactCycleHistory(history)') < 4:
              raise SystemExit('expected compact history projection on status/return/close/run responses')
          if 'checkpoint: compactCycleHistory(resumeHistory)' not in route:
              raise SystemExit('resume checkpoint was not compacted')

          route_path.write_text(route)

          qa_path = Path('scripts/qa-sfi-universal-full-cycle.ts')
          qa = qa_path.read_text()
          qa_anchor = "  assert(signalRoute.includes('suggestedResumeCycleId'), 'intake should expose the existing same-object cycle instead of forcing a parallel run');\n"
          qa_insert = r'''  assert(signalRoute.includes('function compactCycleHistory('), 'external cycle history must have a bounded transport projection');
  assert(signalRoute.includes('checkpoint: compactCycleHistory(resumeHistory)'), 'resume validation must expose a compact checkpoint rather than full event history');
  assert(!signalRoute.includes('history: resumeHistory,'), 'resume validation must never echo full cycle history');
  assert(!signalRoute.includes('reread: history,'), 'external return/close/run responses must not echo full cycle history');
  assert(!signalRoute.includes('cycle: history }, { status: history.ok ? 200 : 500 });'), 'external status must not echo full cycle history');
'''
          if 'external cycle history must have a bounded transport projection' not in qa:
              if qa_anchor not in qa:
                  raise SystemExit('QA insertion anchor not found')
              qa = qa.replace(qa_anchor, qa_anchor + qa_insert, 1)
              qa_path.write_text(qa)
          PY

      - name: Validate focused universal-cycle contract
        run: |
          npm ci --ignore-scripts
          npx tsx scripts/qa-sfi-universal-full-cycle.ts
          npm run typecheck

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "SFI Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/external/v1/signal/route.ts scripts/qa-sfi-universal-full-cycle.ts
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(sfi): bound external cycle history responses [response-boundary-patched]"
          git push origin HEAD:fix/action-response-boundary
