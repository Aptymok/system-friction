name: SFI Main-Only Convergence

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - '.github/sfi-main-convergence-20260827.json'
      - '.github/sfi-main-convergence-reviews-*.json'
      - '.github/workflows/sfi-main-only-convergence.yml'
      - 'scripts/qa-main-only-branch-convergence.mjs'
      - 'src/lib/execution/**'
      - 'src/lib/governance/**'
      - 'src/lib/root/**'
      - 'vercel.json'
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  audit-non-main-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit every non-main branch before deletion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SFI_CONVERGENCE_BRANCH: ${{ github.head_ref }}
        run: node scripts/qa-main-only-branch-convergence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfi-main-only-branch-audit
          path: tmp/main-only-branch-audit.json

  delete-absorbed-branches-after-merge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 347 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/sfi-main-only-cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-audit repository before destructive cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-main-only-branch-convergence.mjs
      - name: Require zero open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length')"
          echo "open_pull_requests=${count}"
          test "${count}" = "0"
      - name: Archive exact non-main heads as durable Git tags before deletion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/sfi-predelete-branch-heads.tsv"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv' > "$manifest"
          test -s "$manifest"
          while IFS=
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "${branch}" = "main" ]; then
              continue
            fi
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
            echo "deleting ${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
      - name: Prove main is the only branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t survivors < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'survivors=%s\n' "${survivors[*]}"
          test "${#survivors[@]}" -eq 1
          test "${survivors[0]}" = "main"
\\t' read -r branch sha; do
            test -n "$branch" && test -n "$sha"
            if [ "$branch" = main ]; then continue; fi
            digest="$(python -c 'import sys,hashlib; print(hashlib.sha256(sys.argv[1].encode()).hexdigest()[:24])' "$branch")"
            tag="refs/tags/sfi-main-archive-20261019/${digest}"
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/sfi-main-archive-20261019/${digest}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              test "$existing" = "$sha" || { echo "ARCHIVE_TAG_CONFLICT:$branch"; exit 1; }
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="$tag" -f sha="$sha" --silent
            fi
          done < "$manifest"
          echo "Archived all secondary branch heads before destructive cleanup"
      - name: Verify no branch advanced after the archival snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/sfi-predelete-branch-heads.tsv"
          while IFS=
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "${branch}" = "main" ]; then
              continue
            fi
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
            echo "deleting ${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
      - name: Prove main is the only branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t survivors < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'survivors=%s\n' "${survivors[*]}"
          test "${#survivors[@]}" -eq 1
          test "${survivors[0]}" = "main"
\\t' read -r branch sha; do
            [ "$branch" = main ] && continue
            encoded="$(python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$branch")"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}" --jq '.object.sha')"
            test "$actual" = "$sha" || { echo "BRANCH_MOVED_AFTER_ARCHIVE:$branch"; exit 1; }
          done < "$manifest"
      - name: Delete every non-main branch after successful audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "${branch}" = "main" ]; then
              continue
            fi
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
            echo "deleting ${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
      - name: Prove main is the only branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t survivors < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'survivors=%s\n' "${survivors[*]}"
          test "${#survivors[@]}" -eq 1
          test "${survivors[0]}" = "main"
