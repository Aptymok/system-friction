name: SFI Self-Development

on:
  push:
    branches:
      - full-remake/repair-self-development-workflow
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - SFI Continuity Hourly
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sfi-self-development
  cancel-in-progress: false

jobs:
  observe-repair-return:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: ${{ false }}
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ false }}
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        if: ${{ false }}
        run: npm ci

      - name: Observe SFI and generate evidence-backed report
        id: observe
        if: ${{ false }}
        continue-on-error: true
        run: node scripts/sfi-self-development.mjs

      - name: Reconstruct canonical Master Program and completion trajectories
        id: completion
        if: ${{ false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sfi-program-completion.mjs

      - name: Persist Completion Controller state in canonical sweep
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/program-completion/completion.md ]; then
            echo 'Completion Controller artifact unavailable; skip canonical sweep comment here and fail closed in the integrity gate.'
            exit 0
          fi
          {
            cat artifacts/program-completion/completion.md
            printf '\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/sfi-program-completion-comment.md
          gh issue comment 405 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sfi-program-completion-comment.md

      - name: Render institutional PDF
        if: ${{ false }}
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python scripts/render-sfi-self-development-report.py

      - name: Upload immutable observation and completion artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: sfi-self-development-${{ github.run_id }}
          path: |
            artifacts/self-development/report.json
            artifacts/self-development/report.md
            artifacts/self-development/SFI_SELF_DEVELOPMENT_REPORT.pdf
            artifacts/program-completion/completion.json
            artifacts/program-completion/completion.md
          retention-days: 90

      - name: Fail closed if Completion Controller integrity failed
        if: ${{ false }}
        shell: bash
        run: |
          echo 'SFI Completion Controller integrity failed.'
          exit 1

      - name: Resolve repair need
        id: state
        if: ${{ false }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('artifacts/self-development/report.json'))
          print('needs_repair=' + ('true' if d.get('findings') else 'false'))
          print('health=' + d.get('health','UNKNOWN'))
          PY

      - name: Workflow half accepted
        run: echo SFI_SELF_DEVELOPMENT_OBSERVATION_HALF_VALID
