name: SFI Self-Development

on:
  push:
    branches:
      - full-remake/repair-self-development-workflow
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - SFI Continuity Hourly
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sfi-self-development
  cancel-in-progress: false

jobs:
  syntax-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow definition accepted
        run: echo SFI_SELF_DEVELOPMENT_WORKFLOW_VALID
