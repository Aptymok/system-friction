name: Temporary governed evidence/UI repair

on:
  push:
    branches:
      - fix/evidence-policy-and-owned-ui-copy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-policy-and-owned-ui-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply controlled repair
        run: node scripts/tmp-apply-evidence-ui-fix.mjs
      - name: Remove temporary repair artifacts
        run: |
          rm scripts/tmp-apply-evidence-ui-fix.mjs
          rm .github/workflows/tmp-apply-evidence-ui-fix.yml
      - name: Commit repaired tree
        run: |
          git config user.name "sfi-governed-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sfi): classify internal evidence correctly and localize owned UI copy"
          git push origin HEAD:fix/evidence-policy-and-owned-ui-copy
