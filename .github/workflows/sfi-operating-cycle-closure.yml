name: SFI Operating Cycle Closure Execution

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/run-sfi-operating-cycle-closure.ts'
      - '.github/workflows/sfi-operating-cycle-closure.yml'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional pre-authorized SFI operating cycle UUID'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sfi-operating-cycle-closure
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel environment authority
        id: creds
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Materialize Vercel project link
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))"

      - name: Pull production runtime environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Execute bounded operating-cycle closure
        shell: bash
        env:
          SFI_CLOSURE_CYCLE_ID: ${{ inputs.cycle_id || '' }}
          NODE_OPTIONS: --conditions=react-server
        run: |
          set -euo pipefail
          test -f .vercel/.env.production.local
          node --env-file=.vercel/.env.production.local --import tsx scripts/run-sfi-operating-cycle-closure.ts
