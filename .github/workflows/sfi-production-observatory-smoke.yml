name: SFI Production Observatory Smoke

on:
  workflow_run:
    workflows:
      - SFI Vercel Prebuilt Production
    types:
      - completed
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sfi-production-observatory-smoke.yml
      - scripts/qa-sfi-production-observatory-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sfi-production-observatory-smoke
  cancel-in-progress: false

jobs:
  observatory-production-return:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout assurance harness
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve canonical production receipt
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$TRIGGER_RUN_ID"
            head_sha="$TRIGGER_HEAD_SHA"
            run_url="$TRIGGER_RUN_URL"
          else
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sfi-vercel-prebuilt-production.yml/runs?branch=main&status=success&per_page=20" \
              > /tmp/sfi-production-runs.json
            mapfile -t receipt < <(node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/sfi-production-runs.json', 'utf8'));
          const run = (data.workflow_runs || []).find((candidate) => candidate.status === 'completed' && candidate.conclusion === 'success');
          if (!run) process.exit(2);
          console.log(run.id);
          console.log(run.head_sha);
          console.log(run.html_url);
          NODE
            )
            [ "${#receipt[@]}" -eq 3 ] || { echo 'SFI_PRODUCTION_RECEIPT_NOT_OBSERVED'; exit 2; }
            run_id="${receipt[0]}"
            head_sha="${receipt[1]}"
            run_url="${receipt[2]}"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "SFI_PRODUCTION_RECEIPT run=$run_id sha=$head_sha url=$run_url"

      - name: Run bounded canonical Observatory production smoke
        id: smoke
        shell: bash
        env:
          SFI_PRODUCTION_SMOKE_TARGET: https://www.systemfriction.org
          SFI_RELATED_DEPLOYMENT_RUN: ${{ steps.receipt.outputs.run_id }}
          SFI_RELATED_DEPLOYMENT_SHA: ${{ steps.receipt.outputs.head_sha }}
          SFI_RELATED_DEPLOYMENT_URL: ${{ steps.receipt.outputs.run_url }}
        run: |
          set +e
          mkdir -p .sfi-assurance
          node scripts/qa-sfi-production-observatory-smoke.mjs 2>&1 | tee .sfi-assurance/production-observatory-smoke.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish assurance summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const output = process.env.GITHUB_STEP_SUMMARY;
          const file = '.sfi-assurance/production-observatory-smoke.json';
          if (!fs.existsSync(file)) {
            fs.appendFileSync(output, '## SFI Production Observatory Smoke\n\n**PRODUCTION RETURN: NOT_OBSERVED**\n\nNo assurance artifact was produced.\n');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const lines = [
            '## SFI Production Observatory Smoke',
            '',
            `- Timestamp: ${report.completedAt || report.startedAt || 'UNKNOWN'}`,
            `- Target: ${report.target || 'UNKNOWN'}`,
            `- Related deployment run: ${report.relatedDeployment?.runId || 'UNKNOWN'}`,
            `- Related deployment SHA: ${report.relatedDeployment?.headSha || 'UNKNOWN'}`,
            `- **PRODUCTION RETURN: ${report.productionReturn || 'NOT_OBSERVED'}**`,
            '',
            '| Gate | Result |',
            '| --- | --- |',
            ...Object.entries(report.gates || {}).map(([name, value]) => `| ${name} | ${value.status || 'NOT_OBSERVED'} |`),
            '',
          ];
          fs.appendFileSync(output, `${lines.join('\n')}\n`);
          NODE

      - name: Upload durable production assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfi-production-observatory-smoke-${{ github.run_id }}
          path: |
            .sfi-assurance/production-observatory-smoke.json
            .sfi-assurance/production-observatory-smoke.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production RETURN result
        if: always()
        shell: bash
        run: |
          code="${{ steps.smoke.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo 'SFI_PRODUCTION_RETURN_PASS'
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo 'SFI_PRODUCTION_RETURN_NOT_OBSERVED'
            exit 2
          fi
          echo 'SFI_PRODUCTION_RETURN_FAIL'
          exit 1
