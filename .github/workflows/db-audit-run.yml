name: SFI DB Audit Run

on:
  push:
    branches:
      - agent/db-audit-run

jobs:
  db-audit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SFI_DB_VERIFY_TIMEOUT_MS: '12000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify canonical database objects
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/db/verify-sfi-database.mjs 2>&1 | tee /tmp/verify.log
      - name: Inventory Supabase tables
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/db/inventory-supabase.mjs 2>&1 | tee /tmp/inventory.log
      - name: Probe post-20260811205500 schema
        id: postprobe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/postprobe.log
          import { createClient } from '@supabase/supabase-js';
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const db = createClient(new URL(url).origin, key, { auth:{persistSession:false} });
          const objects = ['sfi_operating_cycles','sfi_inference_traces','sfi_artifact_trajectory_events'];
          const result = [];
          for (const name of objects) {
            const { count, error } = await db.from(name).select('*',{count:'exact',head:true});
            result.push({name, exists:!error, count: error ? null : (count ?? 0), error:error?.message ?? null, code:error?.code ?? null});
          }
          const { data: cycleCols, error: cycleError } = await db.from('sfi_operating_cycles').select('id,inference_refs,trajectory_refs').limit(1);
          result.push({name:'sfi_operating_cycles.columns(inference_refs,trajectory_refs)', exists:!cycleError, sample:cycleCols?.length ?? 0, error:cycleError?.message ?? null, code:cycleError?.code ?? null});
          console.log(JSON.stringify({ok:result.every(x=>x.exists), result},null,2));
          if (result.some(x=>!x.exists)) process.exitCode = 1;
          NODE
      - name: Upload DB audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sfi-db-audit
          path: |
            docs/db/SFI_DB_VERIFY_*.json
            docs/db/SFI_SUPABASE_INVENTORY_*.json
            docs/db/SFI_SUPABASE_INVENTORY.md
            /tmp/verify.log
            /tmp/inventory.log
            /tmp/postprobe.log
          if-no-files-found: warn
          retention-days: 3
      - name: Fail if audit failed
        if: steps.verify.outcome == 'failure' || steps.inventory.outcome == 'failure' || steps.postprobe.outcome == 'failure'
        run: exit 1
