name: MIHM Contract Validation

on:
  pull_request:
    paths:
      - 'src/lib/mihm/**'
      - 'packages/mihm-core/**'
      - 'scripts/research/mihm-foundation-calibration-t0.ts'
      - 'scripts/research/mihm-foundation-p1-metrology.ts'
      - 'scripts/research/mihm-foundation-p2-lagged-dynamics.ts'
      - 'docs/research/evidence/MIHM-FOUNDATION-P2-LAGGED-DYNAMICS-2026-10-30.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-P2-LAGGED-DYNAMICS-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-P1-SOURCE-METROLOGY-2026-10-30.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-P1-SOURCE-METROLOGY-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-T0-CALIBRATION-2026-10-29.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-CALIBRATION-T0-2026-10-29.md'
      - 'src/lib/method-lab/mihmFoundationDiagnostic.ts'
      - 'src/lib/method-lab/mihmFoundationDiagnosticRun.ts'
      - 'src/lib/method-lab/mihmFoundationDiagnostic.test.ts'
      - 'src/lib/method-lab/registry.ts'
      - 'src/lib/sfi/**'
      - 'src/core/formulas/**'
      - 'src/lib/evaluator/derivedMihmRuntime.ts'
      - 'src/lib/root/sovereign/readers/readRootMihmMatrix.ts'
      - 'src/app/mihm/**'
      - 'src/app/sfi/**'
      - 'src/app/ledger/**'
      - 'src/app/atlas/**'
      - 'docs/MIHM_PHI_CANON.md'
      - 'docs/canon/**'
      - '.github/workflows/mihm-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: MIHM formula, Phi and variable registry tests
        run: node --import tsx --test src/core/formulas/canonicalFormulas.test.ts src/lib/mihm/phiContract.test.ts src/lib/mihm/canonicalVariableRegistry.test.ts

      - name: MIHM foundation measurement coverage research tests
        run: node --import tsx --test src/lib/mihm/foundationObservationCoverage.test.ts

      - name: MIHM typed field trajectory, attractor, propagation and resource boundary tests
        run: node --import tsx --test src/lib/mihm/foundationTypedFieldAudit.test.ts

      - name: MIHM v2 historical P0 arithmetic reproduction (no canonical mutation)
        run: node --import tsx --test src/lib/mihm/historicalV2Arithmetic.test.ts

      - name: MIHM G1 native Method Lab guard regression
        run: node --import tsx --test src/lib/method-lab/mihmFoundationDiagnostic.test.ts

      - name: Typed MIHM instrument and existing scientific caller
        run: |
          node --import tsx --test src/lib/mihm/foundationTypedFieldAudit.test.ts
          node --test src/lib/mihm/scientificMethodRuntime.test.mjs
          node --import tsx --test packages/mihm-core/src/integrated.test.ts

      - name: MIHM P0 historical measurement calibration replay (real archived cohort; no promotion)
        run: node --import tsx scripts/research/mihm-foundation-calibration-t0.ts

      - name: MIHM P1 publisher semantics, historical release clocks and source metrology
        run: node --import tsx --test src/lib/mihm/foundationSourceMetrology.test.ts && node --import tsx scripts/research/mihm-foundation-p1-metrology.ts

      - name: MIHM P2 source-gated lagged dynamics and feature-matched negative controls
        run: node --import tsx --test src/lib/mihm/foundationLaggedDynamics.test.ts && node --import tsx scripts/research/mihm-foundation-p2-lagged-dynamics.ts

      - name: MIHM cultural measurement provenance and missingness
        run: node --import tsx --test src/lib/studio/cultural-lab/agents/mihmAgent.test.ts

      - name: Typed instrument compatibility and decision contradictions
        run: node --import tsx --test src/lib/mihm/instrumentCompatibility.test.ts
