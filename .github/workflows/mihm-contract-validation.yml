name: MIHM Contract Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/mihm/institutionalPhiState.ts'
      - 'src/lib/sfi/math.ts'
      - 'src/core/formulas/**'
      - 'services/python/sfi_engine/**'
      - 'src/observatory/field/catalog/sfStaticDataset.ts'
      - 'data/sfi/sf_static_dataset.compact.json'
      - 'scripts/qa-mihm-nonfabrication.ts'
      - 'scripts/research/mihm-manhattan-365d-source.mjs'
      - 'scripts/research/mihm-manhattan-365d-contrast.mjs'
      - 'docs/research/evidence/MIHM-MANHATTAN-365D-2025-10-2026-09.json'
      - 'docs/research/evidence/MIHM-MANHATTAN-G2B-LAG2-RETROSPECTIVE-2026-10-28.json'
      - 'scripts/qa-sfi-mihm-operational-readback-contract.ts'
      - '.github/workflows/mihm-contract-validation.yml'
  pull_request:
    paths:
      - 'src/lib/mihm/**'
      - 'packages/mihm-core/**'
      - 'scripts/research/mihm-foundation-calibration-t0.ts'
      - 'scripts/research/mihm-foundation-p1-metrology.ts'
      - 'scripts/research/mihm-foundation-p2-lagged-dynamics.ts'
      - 'scripts/research/mihm-foundation-p3-viability-recovery.ts'
      - 'scripts/research/mihm-foundation-p4-readiness.ts'
      - 'scripts/research/mihm-manhattan-365d-source.mjs'
      - 'docs/research/SFI-MIHM-FOUNDATION-P4-PROSPECTIVE-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-P3-VIABILITY-RECOVERY-2026-10-30.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-P3-VIABILITY-RECOVERY-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-P2-LAGGED-DYNAMICS-2026-10-30.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-P2-LAGGED-DYNAMICS-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-P1-SOURCE-METROLOGY-2026-10-30.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-P1-SOURCE-METROLOGY-2026-10-30.md'
      - 'docs/research/evidence/MIHM-FOUNDATION-T0-CALIBRATION-2026-10-29.json'
      - 'docs/research/SFI-MIHM-FOUNDATION-CALIBRATION-T0-2026-10-29.md'
      - 'src/lib/method-lab/mihmFoundationDiagnostic.ts'
      - 'src/lib/method-lab/mihmFoundationDiagnosticRun.ts'
      - 'src/lib/method-lab/mihmFoundationDiagnostic.test.ts'
      - 'src/lib/method-lab/registry.ts'
      - 'src/lib/sfi/**'
      - 'src/core/formulas/**'
      - 'src/lib/evaluator/derivedMihmRuntime.ts'
      - 'src/lib/root/sovereign/readers/readRootMihmMatrix.ts'
      - 'src/app/mihm/**'
      - 'src/app/sfi/**'
      - 'src/app/ledger/**'
      - 'src/app/atlas/**'
      - 'docs/MIHM_PHI_CANON.md'
      - 'docs/canon/**'
      - '.github/workflows/mihm-contract-validation.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'

permissions:
  contents: read

jobs:
  # Source-only evidence collection. A scheduled run does not issue a
  # prediction; unavailable/revised sources stay explicit in its artifact.
  capture_p4_sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4

      - name: Setup Node for official public-source collector
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the 36-day New York observation horizon needed for lag2
        run: node scripts/research/mihm-manhattan-365d-source.mjs --p4-window-check

      - name: Capture last 36 completed New York days, without imputation
        run: node scripts/research/mihm-manhattan-365d-source.mjs --collect-p4-nyc

      - name: Preserve provider responses and explicit missingness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihm-p4-official-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihm-p4-nyc-source.json
          if-no-files-found: error
          retention-days: 90

  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: MIHM formula, Phi and variable registry tests
        run: node --import tsx --test src/core/formulas/canonicalFormulas.test.ts src/lib/mihm/phiContract.test.ts src/lib/mihm/canonicalVariableRegistry.test.ts

      - name: MIHM strict missingness, Python parity and simulated-risk epistemic guard
        run: node --import tsx scripts/qa-mihm-nonfabrication.ts

      - name: MIHM foundation measurement coverage research tests
        run: node --import tsx --test src/lib/mihm/foundationObservationCoverage.test.ts

      - name: MIHM typed field trajectory, attractor, propagation and resource boundary tests
        run: node --import tsx --test src/lib/mihm/foundationTypedFieldAudit.test.ts

      - name: MIHM v2 historical P0 arithmetic reproduction (no canonical mutation)
        run: node --import tsx --test src/lib/mihm/historicalV2Arithmetic.test.ts

      - name: MIHM G1 native Method Lab guard regression
        run: node --import tsx --test src/lib/method-lab/mihmFoundationDiagnostic.test.ts

      - name: Typed MIHM instrument and existing scientific caller
        run: |
          node --import tsx --test src/lib/mihm/foundationTypedFieldAudit.test.ts
          node --test src/lib/mihm/scientificMethodRuntime.test.mjs
          node --import tsx --test packages/mihm-core/src/integrated.test.ts

      - name: MIHM P0 historical measurement calibration replay (real archived cohort; no promotion)
        run: node --import tsx scripts/research/mihm-foundation-calibration-t0.ts

      - name: MIHM P1 publisher semantics, historical release clocks and source metrology
        run: node --import tsx --test src/lib/mihm/foundationSourceMetrology.test.ts && node --import tsx scripts/research/mihm-foundation-p1-metrology.ts

      - name: MIHM P2 source-gated lagged dynamics and feature-matched negative controls
        run: node --import tsx --test src/lib/mihm/foundationLaggedDynamics.test.ts && node --import tsx scripts/research/mihm-foundation-p2-lagged-dynamics.ts

      - name: MIHM P3 illustrative viability excursion, source clocks, and re-entry recovery guards
        run: node --import tsx --test src/lib/mihm/foundationViabilityRecovery.test.ts && node --import tsx scripts/research/mihm-foundation-p3-viability-recovery.ts

      - name: MIHM P4 existing-registry prospective scoring with strict T0 and T1 gates
        run: node --import tsx --test src/lib/mihm/foundationProspectiveScoring.test.ts && node --import tsx scripts/research/mihm-foundation-p4-readiness.ts

      - name: Preserve adversarial MIHM lag2 study losing to conventional controls
        run: node scripts/research/mihm-manhattan-365d-contrast.mjs --verify-lag2-receipt

      - name: Verify scheduled official collection and operational readback contracts
        run: node --import tsx scripts/qa-sfi-mihm-operational-readback-contract.ts

      - name: MIHM cultural measurement provenance and missingness
        run: node --import tsx --test src/lib/studio/cultural-lab/agents/mihmAgent.test.ts

      - name: Typed instrument compatibility and decision contradictions
        run: node --import tsx --test src/lib/mihm/instrumentCompatibility.test.ts
