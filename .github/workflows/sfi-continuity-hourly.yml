name: SFI Continuity Hourly

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sfi-continuity-hourly
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sfi-continuity")"
          token="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Execute governed SFI continuity heartbeat
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SFI_CONTINUITY_ENDPOINT: https://system-friction.vercel.app/api/cron/continuity-heartbeat
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 300 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "X-SFI-Continuity-Trigger: github-actions-oidc" \
            "$SFI_CONTINUITY_ENDPOINT"
