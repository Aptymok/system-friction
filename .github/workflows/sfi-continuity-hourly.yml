name: SFI Continuity Hourly

on:
  schedule:
    # Quarter-hour-offset retries reduce dependence on GitHub's best-effort scheduled delivery.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      cycle_id:
        description: 'Optional existing universal cycleId to recover without opening a new cycle'
        required: false
        type: string
  workflow_run:
    workflows:
      - SFI Vercel Prebuilt Production
      - SFI Verify
      - SFI World + Institutional Observation Cycle
      - World Vector Agents
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: sfi-continuity-hourly
  cancel-in-progress: false
  queue: max

jobs:
  heartbeat:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && format('sfi-post-deploy-assurance-{0}', github.event.workflow_run.id) || format('sfi-continuity-heartbeat-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Resolve optional existing-cycle proof target
        id: target
        shell: bash
        env:
          MANUAL_CYCLE_ID: ${{ inputs.cycle_id || '' }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cycle_id="$MANUAL_CYCLE_ID"
          source="workflow_dispatch"

          if [ -z "$cycle_id" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ -n "$UPSTREAM_SHA" ]; then
            source="deployment_commit_marker"
            commit_file="$RUNNER_TEMP/sfi-deployed-commit.json"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${UPSTREAM_SHA}" > "$commit_file"
            cycle_id="$(python - "$commit_file" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          message = ((payload.get('commit') or {}).get('message') or '')
          match = re.search(r'\[sfi-cycle-proof:([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\]', message)
          print(match.group(1).lower() if match else '')
          PY
            )"
          fi

          if [ -z "$cycle_id" ]; then
            source="none"
          fi
          echo "cycle_id=$cycle_id" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          printf '{"cycleId":"%s","source":"%s"}\n' "$cycle_id" "$source"

      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sfi-continuity")"
          token="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Drain primary mirror or recovery journal through bounded reconciliation
        shell: bash
        # Reuse the governed OIDC route; no direct database writes or bypass of safety gates.
        # Up to 32 calls x 32 transactions, within the existing seven-minute drain budget.
        # Distinguish PRIMARY outbox drain from RECOVERY journal replay; stop on no progress,\n        # conflict, invalid promotion receipt, or time budget. Never force a plane switch.
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SFI_SYNC_ENDPOINT: https://system-friction.vercel.app/api/cron/data-plane-reconcile
        run: |
          set -euo pipefail
          drain_started=$SECONDS
          for round in {1..32}; do
            if (( SECONDS - drain_started >= 420 )); then
              echo 'SFI_MIRROR_DRAIN_TIME_BUDGET_REACHED'
              break
            fi
            receipt="$RUNNER_TEMP/sfi-data-plane-reconciliation-$round.json"
            status="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "X-SFI-Continuity-Trigger: github-actions-oidc" \
              -o "$receipt" -w '%{http_code}' "$SFI_SYNC_ENDPOINT")"
            python - "$receipt" "$status" "$round" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          path, http, round_number, summary = sys.argv[1:]
          with open(path, encoding='utf-8') as stream:
              payload = json.load(stream)
          before = payload.get('before') or {}
          after = payload.get('after') or {}
          primary = payload.get('primaryMirror') or {}
          outbox = after.get('primaryOutbox') or {}
          journal = after.get('journal') or {}
          recovery = payload.get('recovery') or {}
          result = {
              'round': int(round_number), 'http': int(http),
              'attempted': payload.get('attempted'), 'outcome': payload.get('outcome'),
              'beforeMode': (before.get('dataPlane') or {}).get('mode'),
              'afterMode': (after.get('dataPlane') or {}).get('mode'),
              'mirroredTransactions': primary.get('mirroredTransactions'),
              'mirroredRows': primary.get('mirroredRows'),
              'replayedTransactions': recovery.get('replayedTransactions'),
              'replayedRows': recovery.get('replayedRows'),
              'recoveryReason': recovery.get('reason'),
              'pending': outbox.get('pending'), 'conflicts': outbox.get('conflicts'),
              'journalBefore': (before.get('journal') or {}).get('pending'),
              'journalPending': journal.get('pending'),
              'journalConflicts': journal.get('conflicts'),
              'journalProtectedPending': journal.get('protectedPending'),
              'safeRecoveryEligible': after.get('safeRecoveryEligible'),
              'blocker': after.get('blocker'),
              'certified': (after.get('dataPlane') or {}).get('primaryMirrorCertified'),
              'forcedFailover': payload.get('forcedFailover') is True,
          }
          print(json.dumps(result, separators=(',', ':')))
          with open(summary, 'a', encoding='utf-8') as file:
              file.write('SFI primary mirror round: ' + json.dumps(result) + '\\n\\n')
          if http not in ('200', '409') or payload.get('attempted') is not True:
              raise SystemExit('STOP: reconciliation transport or safety gate failed')
          if primary.get('conflict') is True or int(outbox.get('conflicts') or 0) > 0:
              raise SystemExit('STOP: mirror conflict requires investigation')
          if primary.get('ok') is False and int(primary.get('mirroredTransactions') or 0) == 0:
              raise SystemExit('STOP: mirror failed without progress')
          PY
            next_step="$(python - "$receipt" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          before=p.get('before') or {}
          after=p.get('after') or {}
          old_plane=before.get('dataPlane') or {}
          new_plane=after.get('dataPlane') or {}
          old_mode=old_plane.get('mode')
          new_mode=new_plane.get('mode')
          old_journal=before.get('journal') or {}
          journal=after.get('journal') or {}
          old_outbox=before.get('primaryOutbox') or {}
          outbox=after.get('primaryOutbox') or {}
          mirror=p.get('primaryMirror') or {}
          recovery=p.get('recovery') or {}

          def stop_unsafe(reason):
              raise SystemExit('STOP: '+reason)

          def exact_count(record, key):
              value=record.get(key)
              if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                  stop_unsafe('invalid receipt count '+key)
              return value

          if p.get('forcedFailover') is not False or p.get('attempted') is not True:
              stop_unsafe('reconciliation missing guarded execution receipt')
          if exact_count(journal, 'conflicts') != 0 or exact_count(journal, 'protectedPending') != 0:
              stop_unsafe('journal conflict or protected authority pending')
          if exact_count(outbox, 'conflicts') != 0:
              stop_unsafe('primary outbox conflict')

          if old_mode == 'RECOVERY':
              if before.get('safeRecoveryEligible') is not True:
                  stop_unsafe('recovery not eligible before replay')
              pending_before=exact_count(old_journal, 'pending')
              pending_after=exact_count(journal, 'pending')
              if p.get('outcome') == 'PRIMARY_RECOVERED':
                  if new_mode != 'PRIMARY' or pending_after != 0 or new_plane.get('primaryMirrorCertified') is not True or recovery.get('recovered') is not True:
                      stop_unsafe('primary promotion lacks completed certified recovery')
                  print('stop')
              elif p.get('outcome') == 'RECOVERY_NOT_COMPLETE' and recovery.get('reason') == 'CONTINUITY_JOURNAL_NOT_EMPTY':
                  if new_mode != 'RECOVERY' or after.get('safeRecoveryEligible') is not True:
                      stop_unsafe('recovery mode or safety gate changed')
                  if pending_after >= pending_before:
                      stop_unsafe('recovery journal made no progress')
                  if exact_count(recovery, 'replayedTransactions') == 0 or exact_count(recovery, 'replayedRows') == 0:
                      stop_unsafe('recovery has no verified replay receipts')
                  print('continue')
              else:
                  stop_unsafe('recovery incomplete or unexpected outcome')
          elif old_mode == 'PRIMARY':
              if new_mode != 'PRIMARY' or exact_count(journal, 'pending') != 0:
                  stop_unsafe('primary mirror requires review')
              pending_before=exact_count(old_outbox, 'pending')
              pending_after=exact_count(outbox, 'pending')
              if p.get('outcome') == 'PRIMARY_MIRROR_CERTIFIED':
                  if pending_after != 0 or new_plane.get('primaryMirrorCertified') is not True:
                      stop_unsafe('primary mirror certification unverified')
                  print('stop')
              elif p.get('outcome') == 'PRIMARY_MIRROR_PENDING':
                  if pending_after >= pending_before or exact_count(mirror, 'mirroredTransactions') == 0:
                      stop_unsafe('primary mirror made no progress')
                  print('continue')
              else:
                  stop_unsafe('primary mirror incomplete or unexpected outcome')
          else:
              stop_unsafe('unrecognized data plane mode')
          PY
            )"
            if [ "$next_step" = stop ]; then break; fi
          done

      - name: Check whether continuity has real work
        id: wakeup
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SFI_WAKEUP_ENDPOINT: https://system-friction.vercel.app/api/cron/continuity-wakeup
          CYCLE_ID: ${{ steps.target.outputs.cycle_id }}
        run: |
          set -euo pipefail
          endpoint="$SFI_WAKEUP_ENDPOINT"
          if [ -n "$CYCLE_ID" ]; then
            encoded_cycle_id="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["CYCLE_ID"], safe=""))')"
            endpoint="${endpoint}?cycleId=${encoded_cycle_id}"
          fi

          response_file="$RUNNER_TEMP/sfi-continuity-wakeup.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "X-SFI-Continuity-Trigger: github-actions-oidc" \
            "$endpoint" > "$response_file"

          python - "$response_file" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          response_file, output_path, summary_path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(response_file, encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload.get('ok') is not True:
              raise SystemExit('continuity wakeup gate returned ok=false')
          should_run = payload.get('shouldRun') is True
          with open(output_path, 'a', encoding='utf-8') as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          print(json.dumps(payload, ensure_ascii=False, separators=(',', ':')))
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as handle:
                  handle.write('## SFI Continuity wakeup gate\n\n```json\n')
                  handle.write(json.dumps(payload, ensure_ascii=False, indent=2))
                  handle.write('\n```\n')
          PY

      - name: Record idle pulse without heavy runtime execution
        if: steps.wakeup.outputs.should_run != 'true'
        shell: bash
        run: |
          echo 'SFI_CONTINUITY_IDLE_NO_ACTIONABLE_WORK'

      - name: Execute governed SFI continuity heartbeat
        if: steps.wakeup.outputs.should_run == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SFI_CONTINUITY_ENDPOINT: https://system-friction.vercel.app/api/cron/continuity-heartbeat
          CYCLE_ID: ${{ steps.target.outputs.cycle_id }}
          TARGET_SOURCE: ${{ steps.target.outputs.source }}
        run: |
          set -euo pipefail
          endpoint="$SFI_CONTINUITY_ENDPOINT"
          if [ -n "$CYCLE_ID" ]; then
            encoded_cycle_id="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["CYCLE_ID"], safe=""))')"
            endpoint="${endpoint}?cycleId=${encoded_cycle_id}"
          fi

          response_file="$RUNNER_TEMP/sfi-continuity-response.json"
          # Never retry the whole effectful heartbeat. A transport failure can
          # occur after governed effects have already committed.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 300 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "X-SFI-Continuity-Trigger: github-actions-oidc" \
            "$endpoint" > "$response_file"

          python - "$response_file" "$CYCLE_ID" "$TARGET_SOURCE" <<'PY'
          import json, os, sys

          response_file, requested, target_source = sys.argv[1], sys.argv[2].strip(), sys.argv[3].strip()
          with open(response_file, encoding='utf-8') as handle:
              payload = json.load(handle)

          core = payload.get('coreHeartbeat') or {}
          lane_status = payload.get('laneStatus') or {}
          primary_probe = payload.get('primaryPhysicalProbe') or {}
          continuity_rest_probe = payload.get('continuityRestProbe') or {}
          primary_storage_probe = payload.get('primaryStorageProbe') or {}
          recovery_attempt = payload.get('recoveryAttempt') or {}
          universal = payload.get('universalCycleContinuation') or {}
          before = payload.get('returnPlanUpgradeBefore') or {}
          after = payload.get('returnPlanUpgradeAfter') or {}
          empirical = payload.get('universalEmpiricalContinuation') or {}
          target = payload.get('targetCycleState')
          summary = {
              'ok': payload.get('ok'),
              'trigger': payload.get('trigger'),
              'mode': payload.get('mode'),
              'status': payload.get('status'),
              'runId': payload.get('runId'),
              'requestedCycleId': payload.get('requestedCycleId'),
              'targetSource': target_source,
              'coreHeartbeat': core,
              'dataPlane': payload.get('dataPlane'),
              'primaryDiagnostic': payload.get('primaryDiagnostic'),
              'primaryPhysicalProbe': primary_probe,
              'continuityRestProbe': continuity_rest_probe,
              'primaryStorageProbe': primary_storage_probe,
              'recoveryAttempt': recovery_attempt,
              'laneStatus': lane_status,
              'returnPlanUpgradeBefore': {'ok': before.get('ok'), 'processed': before.get('processed'), 'results': before.get('results', [])},
              'universal': {
                  'ok': universal.get('ok'),
                  'availability': universal.get('availability'),
                  'processed': universal.get('processed'),
                  'requestedCycleId': universal.get('requestedCycleId'),
                  'schedulingPolicy': universal.get('schedulingPolicy'),
                  'readRecovery': universal.get('readRecovery'),
                  'error': universal.get('error'),
                  'results': universal.get('results', []),
              },
              'returnPlanUpgradeAfter': {'ok': after.get('ok'), 'processed': after.get('processed'), 'results': after.get('results', [])},
              'empirical': {'ok': empirical.get('ok'), 'processed': empirical.get('processed'), 'results': empirical.get('results', [])},
              'targetCycleState': target,
          }
          print(json.dumps(summary, ensure_ascii=False, separators=(',', ':')))

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as handle:
                  handle.write('## SFI Continuity receipt\n\n```json\n')
                  handle.write(json.dumps(summary, ensure_ascii=False, indent=2))
                  handle.write('\n```\n')

          if core.get('ok') is not True:
              raise SystemExit(f"{core.get('receipt') or 'CORE_HEARTBEAT_FAIL'}: runtimeStatus={core.get('runtimeStatus')}")

          lane_failures = []
          for lane_name, lane in [
              ('returnPlanUpgradeBefore', before),
              ('universalCycleContinuation', universal),
              ('returnPlanUpgradeAfter', after),
              ('universalEmpiricalContinuation', empirical),
          ]:
              if lane.get('ok') is False:
                  lane_failures.append(lane_name)
          if universal.get('ok') is False:
              error = universal.get('error') or {}
              recovery = universal.get('readRecovery') or {}
              raise SystemExit(
                  'UNIVERSAL_CONTINUATION_FAIL: '
                  f"class={error.get('class')} code={error.get('code')} "
                  f"retryable={error.get('retryable')} attempts={recovery.get('attempts')} "
                  f"exhausted={recovery.get('exhausted')} message={error.get('message')}"
              )
          if lane_failures:
              raise SystemExit(f"required continuity lane failed: {','.join(lane_failures)}")
          if payload.get('ok') is not True:
              raise SystemExit('continuity heartbeat reported ok=false: core and inspected lanes pass but overall receipt is false')

          if requested:
              if payload.get('requestedCycleId') != requested:
                  raise SystemExit('targeted cycleId was not acknowledged by the live heartbeat')
              if universal.get('requestedCycleId') != requested:
                  raise SystemExit('targeted cycleId was not acknowledged by the cognitive continuation lane')
              if not isinstance(target, dict) or target.get('ok') is not True or target.get('cycleId') != requested:
                  raise SystemExit('targeted existing cycle was not processed or reconstructed successfully')
              if int(target.get('eventCount') or 0) < 1:
                  raise SystemExit('targeted existing cycle has no reconstructable lifecycle events')
          PY
