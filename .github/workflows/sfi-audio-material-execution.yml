name: SFI Audio Material Execution

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  material-audio:
    name: Verify real SFZ material execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after ${attempt} attempts."
              exit 1
            fi
            rm -rf node_modules/ffmpeg-static
            sleep $((attempt * 10))
          done

      - name: SFI-AUDIO-RIGHTS-SEPARATION-1.0
        run: node --import tsx --test src/lib/studio/audio/materialRegistryContract.test.ts && npx tsx scripts/qa-sfi-audio-rights-separation.ts

      - name: Verify acoustic package and bounded SFZ contract
        run: node --import tsx --test src/lib/studio/audio/acoustic/acousticPackageContract.test.ts

      - name: SFI-AUDIO-EPHEMERAL-ASSET-1.0
        run: npx tsx scripts/qa-sfi-audio-ephemeral-asset.ts

      - name: Render real deterministic SFZ fixture
        run: npx tsx scripts/qa-sfi-sfz-real-render.ts

      - name: Upload real SFZ QA artifact and receipt
        uses: actions/upload-artifact@v4
        with:
          name: sfi-audio-real-sfz-render
          path: |
            build/sfi-audio/ws06-r4a/real-sfz-render.wav
            build/sfi-audio/ws06-r4a/real-sfz-render-receipt.json
          if-no-files-found: error
          retention-days: 14
