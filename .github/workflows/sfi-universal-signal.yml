name: SFI Universal Signal

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/sfi/universalSignalCycle.ts'
      - 'src/lib/execution/governedExecutionRouter.ts'
      - 'src/app/api/external/v1/signal/**'
      - 'src/app/api/external/v1/execution-contract/**'
      - 'src/app/api/external/v1/result/**'
      - 'src/app/api/external/v1/execute/**'
      - 'src/app/api/external/v1/console/**'
      - 'src/app/api/external/v1/manifest/**'
      - 'src/app/api/observatory/world/**'
      - 'src/app/llms.txt/**'
      - 'src/app/ai-index.json/**'
      - 'src/components/sfi/ObservatoryConsole.tsx'
      - 'src/components/sfi/ObservatoryWorldLayer.css'
      - 'scripts/qa-sfi-governed-execution-router.ts'
      - 'scripts/qa-sfi-external-oauth.ts'
      - 'public/openapi.json'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'public/ai-index.json'
      - '.github/workflows/sfi-universal-signal.yml'
  pull_request:
    paths:
      - 'src/lib/sfi/universalSignalCycle.ts'
      - 'src/lib/execution/governedExecutionRouter.ts'
      - 'src/app/api/external/v1/signal/**'
      - 'src/app/api/external/v1/execution-contract/**'
      - 'src/app/api/external/v1/result/**'
      - 'src/app/api/external/v1/execute/**'
      - 'src/app/api/external/v1/console/**'
      - 'src/app/api/external/v1/manifest/**'
      - 'src/app/api/observatory/world/**'
      - 'src/app/llms.txt/**'
      - 'src/app/ai-index.json/**'
      - 'src/components/sfi/ObservatoryConsole.tsx'
      - 'src/components/sfi/ObservatoryWorldLayer.css'
      - 'scripts/qa-sfi-governed-execution-router.ts'
      - 'scripts/qa-sfi-external-oauth.ts'
      - 'public/openapi.json'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'public/ai-index.json'
      - '.github/workflows/sfi-universal-signal.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate OpenAPI JSON
        run: |
          node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync('public/openapi.json','utf8')); const p=o.paths||{}; if(!/^1\.6\./.test(String(o.info?.version||''))||!p['/api/external/v1/signal']||!p['/api/external/v1/execution-contract']||!p['/api/external/v1/result']||!p['/api/external/v1/execute']) process.exit(1); console.log('openapi 1.6.x governed contracts ok')"
      - name: Verify 21 cognitive executors are wired
        run: |
          node --import tsx -e "import { SFI_AGENT_EXECUTION_MAP } from './src/lib/sfi/cognitive-runtime/agentExecutionMap.ts'; const ids=Object.keys(SFI_AGENT_EXECUTION_MAP); console.log(ids.length, ids); if(ids.length!==21) process.exit(1);"
      - name: Verify governed execution router
        run: node --import tsx scripts/qa-sfi-governed-execution-router.ts
      - name: Verify external OAuth execution boundary
        run: node --import tsx scripts/qa-sfi-external-oauth.ts
      - name: Verify raw-object persistence is disabled in preferred flow
        run: |
          node -e "const fs=require('fs'); const manifest=fs.readFileSync('src/app/api/external/v1/manifest/route.ts','utf8'); const result=fs.readFileSync('src/app/api/external/v1/result/route.ts','utf8'); if(!manifest.includes('rawObjectPersistence: false')||!result.includes('rawObjectPersisted:false')) process.exit(1); console.log('REFERENCE_ONLY contract ok')"
      - name: Build
        run: npm run build
