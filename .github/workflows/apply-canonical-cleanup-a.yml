name: Apply Canonical Cleanup A

on:
  push:
    branches:
      - agent/system-consolidation-audit
    paths:
      - scripts/apply-canonical-cleanup-a.mjs
      - .github/workflows/apply-canonical-cleanup-a.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-consolidation-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply structural cleanup
        run: node scripts/apply-canonical-cleanup-a.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Show remaining canonical violations
        shell: bash
        run: node scripts/qa-canonical-architecture.mjs || true
      - name: Remove one-time cleanup machinery
        run: |
          git rm -f scripts/apply-canonical-cleanup-a.mjs
          git rm -f .github/workflows/apply-canonical-cleanup-a.yml
      - name: Commit and push batch
        run: |
          git config user.name "SFI Architecture"
          git config user.email "115195341+Aptymok@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate FIELD paths and obsolete learning runtime"
          git push origin HEAD:agent/system-consolidation-audit
