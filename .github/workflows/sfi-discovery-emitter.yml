name: SFI Discovery Emitter

on:
  pull_request:
    paths:
      - 'src/lib/discovery/**'
      - 'src/lib/research/**'
      - 'src/components/research/**'
      - 'src/app/research/**'
      - 'src/app/publications/**'
      - 'src/app/feed.xml/**'
      - 'src/app/feed.atom/**'
      - 'src/app/feed.json/**'
      - 'src/app/sitemap.ts'
      - 'src/app/ai-index.json/**'
      - 'src/app/ai-policy/**'
      - 'src/app/robots.ts'
      - 'src/app/root/discovery/**'
      - 'src/app/api/root/discovery/**'
      - 'scripts/qa-sfi-discovery-operational.ts'
      - 'scripts/qa-sfi-discovery-emitter.ts'
      - 'scripts/qa-sfi-discovery-exposure.ts'
      - 'scripts/qa-sfi-publication-namespace.ts'
      - 'scripts/qa-sfi-public-research-landing.ts'
      - 'docs/program/SFI-CONTRACT-LOCK.md'
      - 'docs/program/decisions/*PUBLICATION-NAMESPACE*.md'
      - 'supabase/migrations/*discovery_emission_identity.sql'
      - '.github/workflows/sfi-discovery-emitter.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/discovery/**'
      - 'src/lib/research/**'
      - 'src/components/research/**'
      - 'src/app/research/**'
      - 'src/app/publications/**'
      - 'src/app/feed.xml/**'
      - 'src/app/feed.atom/**'
      - 'src/app/feed.json/**'
      - 'src/app/sitemap.ts'
      - 'src/app/ai-index.json/**'
      - 'src/app/ai-policy/**'
      - 'src/app/robots.ts'
      - 'src/app/root/discovery/**'
      - 'src/app/api/root/discovery/**'
      - 'scripts/qa-sfi-discovery-operational.ts'
      - 'scripts/qa-sfi-discovery-emitter.ts'
      - 'scripts/qa-sfi-discovery-exposure.ts'
      - 'scripts/qa-sfi-publication-namespace.ts'
      - 'scripts/qa-sfi-public-research-landing.ts'
      - 'docs/program/SFI-CONTRACT-LOCK.md'
      - 'docs/program/decisions/*PUBLICATION-NAMESPACE*.md'
      - 'supabase/migrations/*discovery_emission_identity.sql'
      - '.github/workflows/sfi-discovery-emitter.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify canonical registry, query mesh, emitter, exposure and institutional lenses
        run: node --import tsx --test src/lib/discovery/canonicalObjectRegistry.test.ts src/lib/discovery/discoveryMesh.test.ts src/lib/discovery/discoveryEmitter.test.ts src/lib/discovery/exposureProjection.test.ts src/lib/discovery/institutionalDiscoveryMesh.test.ts
      - name: Verify durable discovery, exposure and authority boundaries
        run: npx tsx scripts/qa-sfi-discovery-operational.ts && npx tsx scripts/qa-sfi-discovery-emitter.ts && npx tsx scripts/qa-sfi-discovery-exposure.ts
      - name: Verify canonical publication namespace gate
        run: npx tsx scripts/qa-sfi-publication-namespace.ts
      - name: Verify canonical public research landing pages
        run: node --import tsx --test src/lib/research/publicResearchLanding.test.ts && npx tsx scripts/qa-sfi-public-research-landing.ts
      - name: Typecheck
        run: npm run typecheck
