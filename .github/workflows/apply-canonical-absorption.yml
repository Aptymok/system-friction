name: Apply Canonical Absorption

on:
  push:
    branches:
      - agent/system-consolidation-audit
    paths:
      - scripts/apply-canonical-absorption.mjs
      - .github/workflows/apply-canonical-absorption.yml

permissions:
  contents: write

jobs:
  absorb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-consolidation-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply canonical absorption
        run: node scripts/apply-canonical-absorption.mjs
      - name: Remove one-time migration machinery
        run: |
          git rm scripts/apply-canonical-absorption.mjs
          git rm .github/workflows/apply-canonical-absorption.yml
      - name: Commit and push absorbed architecture
        run: |
          git config user.name "SFI Architecture"
          git config user.email "115195341+Aptymok@users.noreply.github.com"
          git add -A
          git commit -m "Absorb Cognitive Twin and canonical runtime ownership"
          git push origin HEAD:agent/system-consolidation-audit
