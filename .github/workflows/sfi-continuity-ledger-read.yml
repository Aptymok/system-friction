name: SFI Continuity Ledger Read Hardening

# Issue #385 corrective assurance; production ownership remains in Universal Cycle Continuation.
on:
  pull_request:
    paths:
      - 'src/lib/sfi/universalCycleContinuation.ts'
      - 'src/lib/sfi/universalCycleContinuation.test.ts'
      - 'src/app/api/cron/continuity-heartbeat/route.ts'
      - '.github/workflows/sfi-continuity-hourly.yml'
      - '.github/workflows/sfi-continuity-ledger-read.yml'

permissions:
  contents: read

jobs:
  continuity-ledger-read:
    name: Universal continuation read recovery and receipt semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Provide server-only marker for isolated Node tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/server-only
          printf '%s\n' '{"name":"server-only","version":"0.0.0-test","main":"index.js"}' > node_modules/server-only/package.json
          printf '%s\n' 'module.exports = {};' > node_modules/server-only/index.js
      - name: Test bounded universal ledger read recovery
        run: node --import tsx --test src/lib/sfi/universalCycleContinuation.test.ts
      - name: Verify existing universal continuation scheduling contract
        run: npx tsx scripts/qa-sfi-operational-next.ts
